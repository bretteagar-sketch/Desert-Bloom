const DB = {
  async post(body) {
    try {

    try { const res = await fetch(`${SHEETS_URL}?t=${Date.now()}`); const json = await res.json(); return json.success ? json.data : null; } catch { return null; }

  async set(sheet, payload) { return this.post({sheet, action:"set", payload}); },

async function sendSMS(to, body, cfg) {
  const res = await fetch(`https://api.twilio.com/2010-04-01/Accounts/${cfg.sid}/Messages.json`, {
    method:"POST",
    headers:{"Authorization":"Basic "+btoa(`${cfg.sid}:${cfg.token}`),"Content-Type":"application/x-www-form-urlencoded"},
    body:new URLSearchParams({To:to,From:cfg.from,Body:body}).toString(),
  });
  const data = await res.json();
  if(!res.ok) throw new Error(data.message||"Twilio error");
  return data;
}

// ── POOL VOLUME CALCULATOR ────────────────────────────────────────────────────
function PoolVolumeCalc() {
  const [length, setLength] = useState("");
  const [width,  setWidth]  = useState("");
  const [shallow,setShallow]= useState("");
  const [deep,   setDeep]   = useState("");
  const [result, setResult] = useState(null);

  const calc = () => {
    const l  = parseFloat(length);
    const w  = parseFloat(width);
    const ds = parseFloat(shallow);
    const dd = parseFloat(deep);
    if([l,w,ds,dd].some(v=>isNaN(v)||v<=0)) { alert("Please fill in all four measurements."); return; }
    const avgDepth = (ds + dd) / 2;
    const cubicFt  = l * w * avgDepth;
    const gallons  = Math.round(cubicFt * 7.48052);
    setResult({ l, w, ds, dd, avgDepth: avgDepth.toFixed(2), cubicFt: cubicFt.toFixed(1), gallons });
  };

  const reset = () => { setLength(""); setWidth(""); setShallow(""); setDeep(""); setResult(null); };

  // Pool diagram — simple SVG side-view of sloped pool
  const Diagram = ({ds, dd}) => {
    const sh = ds || 3.5;
    const dp = dd || 8;
    const maxD = Math.max(sh, dp, 1);
    const shPct = (sh / maxD) * 100;
    const dpPct = (dp / maxD) * 100;
    const W = 280, H = 120, pad = 20;
    const innerW = W - pad * 2;
    const innerH = H - pad * 2;
    const shY = pad + innerH * (1 - shPct / 100) * 0.8;
    const dpY = pad + innerH * (1 - dpPct / 100) * 0.8;
    const botY = pad + innerH * 0.9;
    return (
      <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",maxWidth:320,display:"block",margin:"0 auto"}}>
        {/* water fill */}
        <polygon
          points={`${pad},${shY} ${W-pad},${dpY} ${W-pad},${botY} ${pad},${botY}`}
          fill="rgba(59,130,246,0.18)" stroke="none"
        />
        {/* pool walls */}
        <polyline
          points={`${pad},${pad} ${pad},${botY} ${W-pad},${botY} ${W-pad},${pad}`}
          fill="none" stroke="rgba(255,255,255,0.15)" strokeWidth="2" strokeLinejoin="round"
        />
        {/* water surface line */}
        <line x1={pad} y1={shY} x2={W-pad} y2={dpY} stroke="#3b82f6" strokeWidth="2" strokeDasharray="5,3"/>
        {/* shallow depth arrow */}
        <line x1={pad+14} y1={shY} x2={pad+14} y2={botY} stroke="#22c55e" strokeWidth="1.5" markerEnd="url(#arr)"/>
        <text x={pad+18} y={(shY+botY)/2+4} fontSize="10" fill="#22c55e">{ds||"3.5"}ft</text>
        {/* deep depth arrow */}
        <line x1={W-pad-14} y1={dpY} x2={W-pad-14} y2={botY} stroke="#f5a623" strokeWidth="1.5" markerEnd="url(#arr2)"/>
        <text x={W-pad-42} y={(dpY+botY)/2+4} fontSize="10" fill="#f5a623">{dd||"8"}ft</text>
        {/* labels */}
        <text x={pad+4} y={shY-6} fontSize="10" fill="#22c55e">Shallow</text>
        <text x={W-pad-46} y={dpY-6} fontSize="10" fill="#f5a623">Deep end</text>
        <defs>
          <marker id="arr"  markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#22c55e"/></marker>
          <marker id="arr2" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#f5a623"/></marker>
        </defs>
      </svg>
    );
  };

  return (
    <div style={{padding:"16px",paddingBottom:40}}>
      <div style={{fontSize:18,fontWeight:700,marginBottom:2}}>🏊 Pool Volume</div>
      <div style={{fontSize:13,color:"#4b5563",marginBottom:16}}>Convert pool dimensions to gallons</div>

      {/* Diagram */}
      <Card style={{marginBottom:14,padding:"16px"}}>
        <div style={{fontSize:12,color:"#6b7280",marginBottom:10,textAlign:"center"}}>Side view — typical sloped pool</div>
        <Diagram ds={shallow} dd={deep}/>
      </Card>

      {/* Length & Width */}
      <Card style={{marginBottom:12}}>
        <div style={{fontSize:13,fontWeight:700,color:"#94a3b8",marginBottom:12}}>📐 Pool Size</div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
          <div>
            <div style={{fontSize:11,color:"#6b7280",marginBottom:4,letterSpacing:1}}>LENGTH</div>
            <div style={{position:"relative"}}>
              <input type="number" inputMode="decimal" value={length} onChange={e=>{setLength(e.target.value);setResult(null);}} placeholder="32"
                style={{width:"100%",background:"#111827",border:"1px solid rgba(255,255,255,0.08)",borderRadius:9,padding:"11px 44px 11px 13px",fontSize:16,color:"#e2e8f0",outline:"none",boxSizing:"border-box"}}/>
              <span style={{position:"absolute",right:13,top:"50%",transform:"translateY(-50%)",fontSize:12,color:"#374151",fontWeight:600}}>ft</span>
            </div>
          </div>
          <div>
            <div style={{fontSize:11,color:"#6b7280",marginBottom:4,letterSpacing:1}}>WIDTH</div>
            <div style={{position:"relative"}}>
              <input type="number" inputMode="decimal" value={width} onChange={e=>{setWidth(e.target.value);setResult(null);}} placeholder="16"
                style={{width:"100%",background:"#111827",border:"1px solid rgba(255,255,255,0.08)",borderRadius:9,padding:"11px 44px 11px 13px",fontSize:16,color:"#e2e8f0",outline:"none",boxSizing:"border-box"}}/>
              <span style={{position:"absolute",right:13,top:"50%",transform:"translateY(-50%)",fontSize:12,color:"#374151",fontWeight:600}}>ft</span>
            </div>
          </div>
        </div>
      </Card>

      {/* Depth */}
      <Card style={{marginBottom:16}}>
        <div style={{fontSize:13,fontWeight:700,color:"#94a3b8",marginBottom:4}}>📏 Depth</div>
        <div style={{fontSize:12,color:"#374151",marginBottom:12}}>Most residential pools slope from shallow to deep end</div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
          <div>
            <div style={{fontSize:11,color:"#6b7280",marginBottom:4,letterSpacing:1}}>SHALLOW END</div>
            <div style={{position:"relative"}}>
              <input type="number" inputMode="decimal" value={shallow} onChange={e=>{setShallow(e.target.value);setResult(null);}} placeholder="3.5"
                style={{width:"100%",background:"rgba(34,197,94,0.07)",border:"1px solid rgba(34,197,94,0.25)",borderRadius:9,padding:"11px 44px 11px 13px",fontSize:16,color:"#e2e8f0",outline:"none",boxSizing:"border-box"}}/>
              <span style={{position:"absolute",right:13,top:"50%",transform:"translateY(-50%)",fontSize:12,color:"#22c55e",fontWeight:600}}>ft</span>
            </div>
            <div style={{fontSize:10,color:"#22c55e",marginTop:4}}>Typically 3–4 ft</div>
          </div>
          <div>
            <div style={{fontSize:11,color:"#6b7280",marginBottom:4,letterSpacing:1}}>DEEP END</div>
            <div style={{position:"relative"}}>
              <input type="number" inputMode="decimal" value={deep} onChange={e=>{setDeep(e.target.value);setResult(null);}} placeholder="8"
                style={{width:"100%",background:"rgba(245,166,35,0.07)",border:"1px solid rgba(245,166,35,0.25)",borderRadius:9,padding:"11px 44px 11px 13px",fontSize:16,color:"#e2e8f0",outline:"none",boxSizing:"border-box"}}/>
              <span style={{position:"absolute",right:13,top:"50%",transform:"translateY(-50%)",fontSize:12,color:"#f5a623",fontWeight:600}}>ft</span>
            </div>
            <div style={{fontSize:10,color:"#f5a623",marginTop:4}}>Typically 6–9 ft</div>
          </div>
        </div>
      </Card>

      <button onClick={calc} style={{width:"100%",background:"linear-gradient(135deg,#3b82f6,#06b6d4)",border:"none",borderRadius:14,padding:"15px",fontSize:16,fontWeight:700,color:"#fff",cursor:"pointer",marginBottom:12}}>
        💧 Calculate Volume
      </button>

      {result && (
        <div style={{background:"linear-gradient(135deg,rgba(59,130,246,0.12),rgba(6,182,212,0.08))",borderRadius:16,border:"1px solid rgba(59,130,246,0.3)",padding:"20px",marginBottom:12}}>
          {/* Main result */}
          <div style={{textAlign:"center",marginBottom:16}}>
            <div style={{fontSize:12,color:"#6b7280",marginBottom:4,letterSpacing:2}}>POOL VOLUME</div>
            <div style={{fontSize:48,fontWeight:800,color:"#3b82f6",lineHeight:1}}>{result.gallons.toLocaleString()}</div>
            <div style={{fontSize:16,color:"#60a5fa",fontWeight:600}}>gallons</div>
          </div>

          {/* Breakdown */}
          <div style={{background:"rgba(0,0,0,0.2)",borderRadius:12,padding:"12px 14px",marginBottom:12}}>
            <div style={{fontSize:11,color:"#6b7280",marginBottom:8,letterSpacing:1}}>CALCULATION BREAKDOWN</div>
            <div style={{display:"flex",justifyContent:"space-between",padding:"5px 0",borderBottom:"1px solid rgba(255,255,255,0.04)"}}><span style={{fontSize:12,color:"#94a3b8"}}>Length × Width</span><span style={{fontSize:12,color:"#e2e8f0",fontWeight:600}}>{result.l} × {result.w} ft</span></div>
            <div style={{display:"flex",justifyContent:"space-between",padding:"5px 0",borderBottom:"1px solid rgba(255,255,255,0.04)"}}><span style={{fontSize:12,color:"#94a3b8"}}>Avg depth ({result.ds}+{result.dd} ÷ 2)</span><span style={{fontSize:12,color:"#e2e8f0",fontWeight:600}}>{result.avgDepth} ft</span></div>
            <div style={{display:"flex",justifyContent:"space-between",padding:"5px 0",borderBottom:"1px solid rgba(255,255,255,0.04)"}}><span style={{fontSize:12,color:"#94a3b8"}}>Volume (cu ft)</span><span style={{fontSize:12,color:"#e2e8f0",fontWeight:600}}>{result.cubicFt} ft³</span></div>
            <div style={{display:"flex",justifyContent:"space-between",padding:"5px 0"}}><span style={{fontSize:12,color:"#94a3b8"}}>× 7.48 gal/ft³</span><span style={{fontSize:12,color:"#3b82f6",fontWeight:700}}>{result.gallons.toLocaleString()} gal</span></div>
          </div>

          {/* Common reference sizes */}
          <div style={{fontSize:11,color:"#6b7280",marginBottom:6,letterSpacing:1}}>COMMON POOL SIZES FOR REFERENCE</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:6}}>
            {[["Small",10000],["Average",15000],["Large",25000]].map(([label,gal])=>(
              <div key={label} style={{background:Math.abs(result.gallons-gal)<3000?"rgba(59,130,246,0.15)":"rgba(255,255,255,0.03)",borderRadius:8,padding:"8px",textAlign:"center",border:Math.abs(result.gallons-gal)<3000?"1px solid rgba(59,130,246,0.3)":"1px solid transparent"}}>
                <div style={{fontSize:10,color:"#6b7280"}}>{label}</div>
                <div style={{fontSize:11,fontWeight:700,color:Math.abs(result.gallons-gal)<3000?"#60a5fa":"#475569"}}>{(gal/1000).toFixed(0)}k gal</div>
              </div>
            ))}
          </div>
        </div>
      )}

      {result && (
        <button onClick={reset} style={{width:"100%",background:"rgba(255,255,255,0.04)",border:"1px solid rgba(255,255,255,0.08)",borderRadius:12,padding:"12px",fontSize:13,color:"#6b7280",cursor:"pointer"}}>
          ↺ Reset
        </button>
      )}
    </div>
  );
}

// ── SERVICE VISIT ─────────────────────────────────────────────────────────────
const CHECKLIST=[
  {id:"brush",  label:"Brush Walls & Steps",icon:"🪣"},
  {id:"skim",   label:"Skim / Net Surface",  icon:"🕸️"},
  {id:"skimmer",label:"Skimmer Basket",      icon:"🧺"},
  {id:"pump",   label:"Pump Basket",         icon:"⚙️"},
  {id:"filter", label:"Cleaned Filter",      icon:"🔵",isFilter:true},
];

const CHEM_OPTIONS={
  ph_low:[
    {id:"soda_ash",    label:"Soda Ash (Sodium Carbonate)",      unit:"lbs",  formula:(d,g)=>+(d/0.2*0.75*(g/10000)).toFixed(2)},
    {id:"baking_soda_ph",label:"Baking Soda (mild pH raise)",   unit:"lbs",  formula:(d,g)=>+(d/0.1*1.5*(g/10000)).toFixed(2)},
  ],
  ph_high:[
    {id:"muriatic",    label:"Muriatic Acid (31.45%)",           unit:"qts",  formula:(d,g)=>+(d/0.2*10.64/32*(g/10000)).toFixed(2)},
    {id:"dry_acid",    label:"Dry Acid (Sodium Bisulfate)",      unit:"lbs",  formula:(d,g)=>+(d/0.2*0.5*(g/10000)).toFixed(2)},
  ],
  chlorine_low:[
    {id:"liquid_cl",   label:"Liquid Chlorine (10–12%)",         unit:"qts",  formula:(d,g)=>+(d*13/32*(g/10000)).toFixed(2)},
    {id:"cal_hypo",    label:"Cal-Hypo 68% (granular)",          unit:"lbs",  formula:(d,g)=>+(d/5*(g/10000)).toFixed(2)},
    {id:"shock",       label:"Pool Shock (1 lb bags)",           unit:"lbs",  formula:(d,g)=>+(d/5*(g/10000)).toFixed(2)},
  ],
  alkalinity_low:[
    {id:"baking_soda", label:"Baking Soda (Sodium Bicarbonate)", unit:"lbs",  formula:(d,g)=>+(d/10*1.4*(g/10000)).toFixed(2)},
  ],
  alkalinity_high:[
    {id:"muriatic_alk",label:"Muriatic Acid (31.45%)",           unit:"qts",  formula:(d,g)=>+(d/10*0.8*(g/10000)).toFixed(2)},
  ],
  calcium_low:[
    {id:"cal_chloride",label:"Calcium Chloride (77%)",           unit:"lbs",  formula:(d,g)=>+(d/10*1.2*(g/10000)).toFixed(2)},
  ],
  salt_low:[
    {id:"pool_salt",   label:"Pool Salt (NaCl)",                 unit:"lbs",  formula:(d,g)=>+(d/500*50*(g/10000)).toFixed(0)},
  ],
};

function ServiceVisit({pool,filterEvery,twilio,currentUser,onComplete,onBack,onLogVisit}){
  const [step,setStep]=useState("start");
  const [elapsed,setElapsed]=useState(0);
  const [running,setRunning]=useState(false);
  const timerRef=useRef();
  const [beforePhotos,setBeforePhotos]=useState([]);
  const [afterPhotos,setAfterPhotos]=useState([]);
  const [chem,setChem]=useState({ph:"",chlorine:"",alkalinity:"",calcium:"",salt:"",notes:""});
  const [checks,setChecks]=useState({});
  const [filterDone,setFilterDone]=useState(false);
  const [finishing,setFinishing]=useState(false);
  const [selectedChems,setSelectedChems]=useState({});
  const [addedChems,setAddedChems]=useState({});
  const [showDosingModal,setShowDosingModal]=useState(false);
  const [chemAddedAmounts,setChemAddedAmounts]=useState({});
  const [chlorineTabs,setChlorineTabs]=useState("");
  const [reportText,setReportText]=useState("");

  const filterDue=pool.filterVisits>=filterEvery;
  const required=CHECKLIST.filter(i=>!i.isFilter||filterDue);
  const allDone=required.every(i=>i.isFilter?filterDone:!!checks[i.id]);

  useEffect(()=>{
    if(running) timerRef.current=setInterval(()=>setElapsed(e=>e+1),1000);
    else clearInterval(timerRef.current);
    return()=>clearInterval(timerRef.current);
  },[running]);

  const finish=async()=>{
    setRunning(false);setFinishing(true);
    const ph=chem.ph?parseFloat(chem.ph):null;
    const cl=chem.chlorine?parseFloat(chem.chlorine):null;
    const alk=chem.alkalinity?parseFloat(chem.alkalinity):null;
    const cal=chem.calcium?parseFloat(chem.calcium):null;
    const _ds=(d)=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    const _chemsLogged=Object.entries(chemAddedAmounts).filter(([,v])=>v).map(([key,amt])=>{const v2=parseFloat(chem[key])||pool[key]||0;const[lo,hi]=CR[key]||[0,0];const s=v2<lo?"low":v2>hi?"high":"ok";const opts=CHEM_OPTIONS[`${key}_${s}`]||[];const selId=selectedChems[key]||(opts[0]?.id||"");const sel=opts.find(o=>o.id===selId)||opts[0];return{chemical:sel?.label||key,amount:amt,unit:sel?.unit||""};});
    const _hist={date:_ds(new Date()),completed:true,tech:currentUser.name,readings:{ph,chlorine:cl,alkalinity:alk,calcium:cal},chemicals:_chemsLogged,chlorineTabs,duration:elapsed,notes:chem.notes||""};
    const updated={...pool,ph:ph??pool.ph,chlorine:cl??pool.chlorine,alkalinity:alk??pool.alkalinity,calcium:cal??pool.calcium,notes:chem.notes||pool.notes,status:"Completed",lastService:todayStr(),photos:[...pool.photos,...beforePhotos],afterPhotos:[...afterPhotos],visits:pool.visits+1,filterVisits:filterDone?0:pool.filterVisits+1,lastDuration:elapsed,serviceHistory:[...(pool.serviceHistory||[]).filter(h=>h.date!==_hist.date),_hist]};
    onLogVisit({customer:pool.customer,tech:currentUser.name,duration:elapsed,ph,chlorine:cl,alkalinity:alk,calcium:cal,notes:chem.notes,filterCleaned:filterDone,beforePhotos:beforePhotos.length,afterPhotos:afterPhotos.length});
    if(twilio?.sid&&pool.phone){
      const chemLog=[
        {key:"ph",label:"pH",unit:""},
        {key:"chlorine",label:"Chlorine",unit:" ppm"},
        {key:"alkalinity",label:"Alkalinity",unit:" ppm"},
        {key:"calcium",label:"Calcium",unit:" ppm"},
        ...(pool.salt?[{key:"salt",label:"Salt",unit:" ppm"}]:[]),
      ].map(p=>{
        const amt=chemAddedAmounts[p.key];if(!amt)return null;
        const v=parseFloat(chem[p.key])||pool[p.key]||0;const [lo,hi]=(CR[p.key]||[2700,3400]);
        const s=v<lo?"low":v>hi?"high":"ok";
        const opts=CHEM_OPTIONS[`${p.key}_${s}`]||[];
        const selId=selectedChems[p.key]||(opts[0]?.id||"");
        const selOpt=opts.find(o=>o.id===selId)||opts[0];
        return `• ${p.label}: ${amt} ${selOpt?.unit||""} of ${selOpt?.label||""}`;
      }).filter(Boolean).join("\n");
      const tabsLine=chlorineTabs?`• Chlorine Tabs: ${chlorineTabs} tab${chlorineTabs==="1"?"":"s"}`:"";
      const readingLines=[ph!=null?`• pH: ${ph}`:null,cl!=null?`• Chlorine: ${cl} ppm`:null,alk!=null?`• Alkalinity: ${alk} ppm`:null,cal!=null?`• Calcium: ${cal} ppm`:null].filter(Boolean).join("\n");
      const addedLines=[chemLog,tabsLine].filter(Boolean).join("\n");
      const body=`Hi ${pool.customer.split(" ")[0]}! ✅ Your Desert Bloom pool service is complete!\n\n${readingLines?`💧 Chemistry:\n${readingLines}\n`:""}${addedLines?`\n🧪 Chemicals Added:\n${addedLines}\n`:""}\nDuration: ${fmtTime(elapsed)}\n🌵 — Desert Bloom`;
      setReportText(body);
      try{ await sendSMS(pool.phone,body,twilio); }catch{}
    }
    setFinishing(false);onComplete(updated);setStep("done");
  };

  if(step==="done") return(
    <div style={{fontFamily:"sans-serif",background:"#060d1a",minHeight:"100vh",color:"#e2e8f0",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:24}}>
      <div style={{fontSize:60,marginBottom:12}}>✅</div>
      <div style={{fontSize:22,fontWeight:800,color:"#22c55e",marginBottom:6}}>Visit Complete!</div>
      <div style={{fontSize:14,color:"#6b7280",marginBottom:4}}>{pool.customer}</div>
      <div style={{fontSize:13,color:"#94a3b8",marginBottom:20}}>Duration: {fmtTime(elapsed)}</div>
      <button onClick={onBack} style={{background:"linear-gradient(135deg,#3b82f6,#06b6d4)",border:"none",borderRadius:14,padding:"14px 32px",fontSize:15,fontWeight:700,color:"#fff",cursor:"pointer"}}>← Back to Route</button>
    </div>
  );

  const stepList=["before_photos","chemicals","checklist","after_photos"];
  const stepIdx=stepList.indexOf(step);

  return(
    <div style={{fontFamily:"sans-serif",background:"#060d1a",minHeight:"100vh",color:"#e2e8f0",paddingBottom:30}}>
      <div style={{background:"#0a1628",borderBottom:"1px solid rgba(59,130,246,0.15)",padding:"13px 16px"}}>
        {step==="start"&&<button onClick={onBack} style={{background:"rgba(59,130,246,0.1)",border:"1px solid rgba(59,130,246,0.2)",borderRadius:8,padding:"6px 12px",fontSize:12,color:"#60a5fa",cursor:"pointer",marginBottom:10}}>← Back</button>}
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div><div style={{fontWeight:700,fontSize:15}}>Service Visit</div><div style={{fontSize:12,color:"#6b7280"}}>{pool.customer}</div></div>
          {elapsed>0&&<div style={{fontFamily:"monospace",fontSize:20,fontWeight:800,color:"#60a5fa"}}>{fmtTime(elapsed)}</div>}
        </div>
        {running&&<div style={{display:"flex",alignItems:"center",gap:6,marginTop:6}}><div style={{width:7,height:7,borderRadius:50,background:"#22c55e",boxShadow:"0 0 6px #22c55e"}}/><span style={{fontSize:11,color:"#94a3b8"}}>In progress</span></div>}
      </div>

      {step!=="start"&&<div style={{display:"flex",gap:4,padding:"10px 16px 0"}}>{stepList.map((s,i)=><div key={s} style={{flex:1,height:4,borderRadius:99,background:stepIdx>i?"#22c55e":stepIdx===i?"#3b82f6":"#1f2937"}}/>)}</div>}

      <div style={{padding:"16px"}}>
        {step==="start"&&(
          <>
            <div style={{textAlign:"center",padding:"12px 0 10px"}}>
              <div style={{fontSize:40,marginBottom:8}}>🏊</div>
              <div style={{fontSize:19,fontWeight:800,marginBottom:4}}>{pool.customer}</div>
              <button onClick={()=>openMaps(pool.address)} style={{fontSize:13,color:"#60a5fa",background:"none",border:"none",cursor:"pointer",textDecoration:"underline"}}>📍 {pool.address.split(",")[0]}</button>
            </div>
            <Card style={{marginBottom:12}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                <div style={{fontSize:13,fontWeight:700}}>🔵 Filter Tally</div>
                {filterDue?<span style={{background:"rgba(239,68,68,0.15)",color:"#ef4444",fontSize:11,fontWeight:700,padding:"3px 9px",borderRadius:20}}>DUE THIS VISIT</span>:<span style={{fontSize:12,color:"#6b7280"}}>{filterEvery-pool.filterVisits} visits until due</span>}
              </div>
              <div style={{background:"#111827",borderRadius:99,height:7,overflow:"hidden",marginBottom:4}}><div style={{width:`${Math.min((pool.filterVisits/filterEvery)*100,100)}%`,height:"100%",borderRadius:99,background:filterDue?"#ef4444":"linear-gradient(90deg,#3b82f6,#06b6d4)"}}/></div>
              <div style={{fontSize:11,color:"#374151"}}>Visit {pool.filterVisits} of {filterEvery}</div>
            </Card>
            {pool.notes&&<div style={{background:"rgba(245,166,35,0.06)",border:"1px solid rgba(245,166,35,0.2)",borderRadius:12,padding:"12px 14px",marginBottom:12}}><div style={{fontSize:12,fontWeight:700,color:"#f5a623",marginBottom:3}}>📝 Notes</div><div style={{fontSize:13,color:"#d1d5db"}}>{pool.notes}</div></div>}
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:12}}><Gauge label="pH" val={pool.ph} type="ph" unit=""/><Gauge label="Chlorine" val={pool.chlorine} type="chlorine" unit=" ppm"/></div>
            <button onClick={()=>{setRunning(true);setStep("before_photos");}} style={{width:"100%",background:"linear-gradient(135deg,#22c55e,#16a34a)",border:"none",borderRadius:14,padding:"16px",fontSize:16,fontWeight:800,color:"#fff",cursor:"pointer"}}>▶ Start Visit & Timer</button>
          </>
        )}
        {step==="before_photos"&&(
          <>
            <div style={{fontSize:16,fontWeight:700,marginBottom:4}}>📷 Before Photos</div>
            <div style={{fontSize:13,color:"#6b7280",marginBottom:14}}>Capture pool condition before starting</div>
            <Card style={{marginBottom:14}}><Photos photos={beforePhotos} onAdd={p=>setBeforePhotos(v=>[...v,p])} label="Before Photos"/></Card>
            <button onClick={()=>setStep("chemicals")} style={{width:"100%",background:"linear-gradient(135deg,#3b82f6,#06b6d4)",border:"none",borderRadius:14,padding:"14px",fontSize:15,fontWeight:700,color:"#fff",cursor:"pointer",marginBottom:8}}>Next: Chemicals →</button>
            <button onClick={()=>setStep("chemicals")} style={{width:"100%",background:"none",border:"none",color:"#6b7280",fontSize:13,cursor:"pointer"}}>Skip photos</button>
          </>
        )}
        {step==="chemicals"&&(
          <>
            <div style={{fontSize:16,fontWeight:700,marginBottom:4}}>⚗️ Chemical Readings</div>
            <div style={{fontSize:13,color:"#6b7280",marginBottom:14}}>Log today's water chemistry</div>
            <Card style={{marginBottom:14}}>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>
                {[["pH","ph","7.4"],["Chlorine (ppm)","chlorine","2.0"],["Alkalinity (ppm)","alkalinity","100"],["Calcium (ppm)","calcium","250"]].map(([l,k,ph])=>(
                  <div key={k}><div style={{fontSize:11,color:"#6b7280",marginBottom:4}}>{l}</div><input value={chem[k]} onChange={e=>setChem(v=>({...v,[k]:e.target.value}))} placeholder={ph} style={{width:"100%",background:"#111827",border:"1px solid rgba(255,255,255,0.08)",borderRadius:8,padding:"9px 10px",fontSize:13,color:"#e2e8f0",outline:"none",boxSizing:"border-box"}}/></div>
                ))}
              </div>
              {pool.salt&&<div style={{marginBottom:10}}><div style={{fontSize:11,color:"#6b7280",marginBottom:4}}>SALT (PPM)</div><input value={chem.salt} onChange={e=>setChem(v=>({...v,salt:e.target.value}))} placeholder="3200" style={{width:"100%",background:"#111827",border:"1px solid rgba(255,255,255,0.08)",borderRadius:8,padding:"9px 10px",fontSize:13,color:"#e2e8f0",outline:"none",boxSizing:"border-box"}}/></div>}
              <div><div style={{fontSize:11,color:"#6b7280",marginBottom:4}}>CHEMICALS ADDED / NOTES</div><textarea value={chem.notes} onChange={e=>setChem(v=>({...v,notes:e.target.value}))} placeholder="e.g. Added 2 lbs shock..." style={{width:"100%",background:"#111827",border:"1px solid rgba(255,255,255,0.08)",borderRadius:8,padding:"9px 10px",fontSize:13,color:"#e2e8f0",outline:"none",resize:"none",height:70,boxSizing:"border-box"}}/></div>
            </Card>
            <button onClick={()=>setShowDosingModal(true)} style={{width:"100%",background:"linear-gradient(135deg,#3b82f6,#06b6d4)",border:"none",borderRadius:14,padding:"14px",fontSize:15,fontWeight:700,color:"#fff",cursor:"pointer"}}>Analyze Chemistry →</button>
          </>
        )}
        {showDosingModal&&(
          <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.93)",zIndex:9999,overflowY:"auto"}}>
            <div style={{background:"#060d1a",minHeight:"100vh",padding:"16px 16px 50px"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
                <div style={{fontSize:18,fontWeight:700}}>🧪 Chemistry Analysis</div>
                <div style={{fontSize:12,color:"#6b7280"}}>{pool.size}</div>
              </div>
              <div style={{fontSize:13,color:"#6b7280",marginBottom:16}}>Review what's needed, select your chemical, and log what you actually added</div>
              {[
                {key:"ph",        label:"pH",              unit:"",     range:CR.ph},
                {key:"chlorine",  label:"Chlorine",         unit:" ppm", range:CR.chlorine},
                {key:"alkalinity",label:"Alkalinity",       unit:" ppm", range:CR.alkalinity},
                {key:"calcium",   label:"Calcium Hardness", unit:" ppm", range:CR.calcium},
                ...(pool.salt?[{key:"salt",label:"Salt",unit:" ppm",range:[2700,3400]}]:[]),
              ].map(param=>{
                if(!chem[param.key]) return null;
                const val=parseFloat(chem[param.key]);
                const [lo,hi]=param.range;
                const s=val<lo?"low":val>hi?"high":"ok";
                const diff=s==="low"?+(lo-val).toFixed(2):s==="high"?+(val-hi).toFixed(2):0;
                const gal=parseGallons(pool.size);
                const opts=CHEM_OPTIONS[`${param.key}_${s}`]||[];
                const selId=selectedChems[param.key]||(opts[0]?.id||"");
                const selOpt=opts.find(o=>o.id===selId)||opts[0];
                const dose=selOpt?selOpt.formula(diff,gal):0;
                const addedAmt=chemAddedAmounts[param.key]||"";
                return(
                  <div key={param.key} style={{background:"#0d1626",borderRadius:14,padding:"14px 16px",marginBottom:10,border:`1px solid ${s==="ok"?"rgba(34,197,94,0.2)":s==="low"?"rgba(239,68,68,0.3)":"rgba(245,166,35,0.3)"}`}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:s!=="ok"?10:0}}>
                      <div>
                        <div style={{fontSize:13,fontWeight:700,color:"#e2e8f0"}}>{param.label}</div>
                        <div style={{fontSize:12,color:"#6b7280"}}>Reading: <span style={{fontWeight:700,color:s==="ok"?"#22c55e":s==="low"?"#ef4444":"#f5a623"}}>{val}{param.unit}</span><span style={{color:"#4b5563"}}> · Target {lo}–{hi}{param.unit}</span></div>
                      </div>

                          </div>
                          <div style={{fontSize:10,color:"#374151",textAlign:"right"}}>Based on<br/>{pool.size}</div>
                        </div>
                        <div style={{fontSize:11,color:"#6b7280",marginBottom:6,letterSpacing:1}}>HOW MUCH DID YOU ADD?</div>
                        <div style={{display:"flex",gap:8,alignItems:"center"}}>

                          <span style={{fontSize:13,color:"#6b7280",minWidth:55}}>{selOpt?.unit}</span>

                  </div>

              })}

                <div style={{fontSize:12,color:"#6b7280",marginBottom:10}}>How many tabs did you add to the floater / feeder?</div>
                <div style={{display:"flex",gap:8,alignItems:"center"}}>
                  <input type="number" inputMode="numeric" value={chlorineTabs} onChange={e=>setChlorineTabs(e.target.value)} placeholder="0" style={{flex:1,background:"#111827",border:`1px solid ${chlorineTabs?"rgba(34,197,94,0.4)":"rgba(255,255,255,0.1)"}`,borderRadius:8,padding:"10px 12px",fontSize:20,fontWeight:700,color:"#e2e8f0",outline:"none",boxSizing:"border-box"}}/>
                  <span style={{fontSize:14,color:"#6b7280"}}>tabs</span>

              </div>

            </div>
          </div>
        )}
        {step==="checklist"&&(
          <>
            <div style={{fontSize:16,fontWeight:700,marginBottom:4}}>✅ Service Checklist</div>
            <div style={{fontSize:13,color:"#6b7280",marginBottom:14}}>Check off each completed task</div>
            <Card style={{padding:"4px 16px",marginBottom:14}}>
              {CHECKLIST.map(item=>{
                const due=!item.isFilter||filterDue;
                const checked=item.isFilter?filterDone:!!checks[item.id];
                return(
                  <div key={item.id} onClick={()=>due&&(item.isFilter?setFilterDone(v=>!v):setChecks(v=>({...v,[item.id]:!v[item.id]})))} style={{display:"flex",alignItems:"center",gap:12,padding:"13px 0",borderBottom:"1px solid rgba(255,255,255,0.04)",cursor:due?"pointer":"default",opacity:due?1:0.35}}>
                    <div style={{width:26,height:26,borderRadius:7,background:checked?"#22c55e":"#1f2937",border:`2px solid ${checked?"#22c55e":"rgba(255,255,255,0.1)"}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:14,color:"#fff",fontWeight:700,flexShrink:0}}>{checked?"✓":""}</div>
                    <div style={{flex:1}}>
                      <div style={{fontSize:15,fontWeight:600,color:checked?"#22c55e":"#e2e8f0"}}>{item.icon} {item.label}</div>
                      {item.isFilter&&filterDue&&<div style={{fontSize:11,color:"#ef4444",marginTop:2}}>🔴 Due — tally resets to 0</div>}
                      {item.isFilter&&!filterDue&&<div style={{fontSize:11,color:"#374151"}}>Not due — {filterEvery-pool.filterVisits} visits left</div>}
                    </div>
                  </div>
                );
              })}
            </Card>
            <div style={{fontSize:12,color:allDone?"#22c55e":"#6b7280",textAlign:"center",marginBottom:10}}>{allDone?"✓ All tasks done!":`${Object.values(checks).filter(Boolean).length+(filterDone?1:0)} / ${required.length} tasks`}</div>
            <button onClick={()=>setStep("after_photos")} disabled={!allDone} style={{width:"100%",background:allDone?"linear-gradient(135deg,#3b82f6,#06b6d4)":"#1f2937",border:"none",borderRadius:14,padding:"14px",fontSize:15,fontWeight:700,color:allDone?"#fff":"#374151",cursor:allDone?"pointer":"not-allowed"}}>Next: After Photos →</button>
          </>
        )}
        {step==="after_photos"&&(
          <>
            <div style={{fontSize:16,fontWeight:700,marginBottom:4}}>📷 After Photos</div>
            <div style={{fontSize:13,color:"#6b7280",marginBottom:14}}>Show the finished result</div>
            <Card style={{marginBottom:14}}><Photos photos={afterPhotos} onAdd={p=>setAfterPhotos(v=>[...v,p])} label="After Photos"/></Card>
            <button onClick={finish} disabled={finishing} style={{width:"100%",background:finishing?"#1f2937":"linear-gradient(135deg,#22c55e,#16a34a)",border:"none",borderRadius:14,padding:"15px",fontSize:15,fontWeight:700,color:finishing?"#6b7280":"#fff",cursor:finishing?"not-allowed":"pointer",marginBottom:8}}>{finishing?"⏳ Finishing...":"✓ Complete Visit"}</button>
            <button onClick={finish} disabled={finishing} style={{width:"100%",background:"none",border:"none",color:"#6b7280",fontSize:13,cursor:"pointer"}}>Skip after photos & finish</button>
          </>
        )}
      </div>
    </div>
  );
}

  const filterDue=pool.filterVisits>=filterEvery;
  return(
    <div style={{fontFamily:"sans-serif",background:"#060d1a",minHeight:"100vh",color:"#e2e8f0",paddingBottom:30}}>

        </Card>
        <Card style={{marginBottom:12,border:`1px solid ${filterDue?"rgba(239,68,68,0.35)":"rgba(255,255,255,0.06)"}`}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
            <div style={{fontSize:13,fontWeight:700}}>🔵 Filter Tally</div>

          </div>

        </Card>
        <Card style={{marginBottom:12}}>
          <div style={{fontSize:13,fontWeight:700,marginBottom:10}}>⚗️ Chemistry</div>

            <Gauge label="pH" val={pool.ph} type="ph" unit=""/>
            <Gauge label="Chlorine" val={pool.chlorine} type="chlorine" unit=" ppm"/>
            <Gauge label="Alkalinity" val={pool.alkalinity} type="alkalinity" unit=" ppm"/>

        </Card>
        <Card style={{marginBottom:12}}>
          <div style={{fontSize:13,fontWeight:700,marginBottom:8}}>🔧 Equipment</div>
          {pool.equipment.map((e,i)=>{

            return(<div key={i} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 0",borderBottom:i<pool.equipment.length-1?"1px solid rgba(255,255,255,0.04)":"none"}}><div style={{width:7,height:7,borderRadius:50,background:issue?"#ef4444":"#22c55e",flexShrink:0}}/><span style={{fontSize:13,flex:1}}>{e}</span>{issue&&<span style={{fontSize:10,color:"#ef4444",fontWeight:700,background:"rgba(239,68,68,0.1)",padding:"2px 6px",borderRadius:8}}>ISSUE</span>}</div>);

              <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>{pool.afterPhotos.map((p,i)=><div key={i} style={{width:70,height:70,borderRadius:10,overflow:"hidden",border:"1px solid rgba(255,255,255,0.1)"}}><img src={p.src} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}}/></div>)}</div>
            </div>
          )}
        </Card>
        {pool.notes&&<div style={{background:"rgba(245,166,35,0.06)",border:"1px solid rgba(245,166,35,0.2)",borderRadius:12,padding:"12px 14px",marginBottom:12}}><div style={{fontSize:12,fontWeight:700,color:"#f5a623",marginBottom:3}}>📝 Notes</div><div style={{fontSize:13,color:"#d1d5db"}}>{pool.notes}</div></div>}
        {pool.lastDuration&&<div style={{fontSize:12,color:"#6b7280",textAlign:"center",marginBottom:10}}>Last visit: {fmtTime(pool.lastDuration)}</div>}
        {(()=>{
          const hist=(pool.serviceHistory||[]).slice().sort((a,b)=>b.date.localeCompare(a.date));
          if(!hist.length)return null;
          const MN=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
          const byMonth={};
          hist.forEach(h=>{const[y,m]=h.date.split("-");const k=`${y}-${m}`;if(!byMonth[k])byMonth[k]={label:`${MN[parseInt(m)-1]} ${y}`,visits:[]};byMonth[k].visits.push(h);});
          return(
            <Card style={{marginBottom:12}}>
              <div style={{fontSize:13,fontWeight:700,marginBottom:12}}>📋 Service History</div>
              {Object.values(byMonth).map(month=>(

                    <span style={{fontSize:11,background:"rgba(59,130,246,0.1)",color:"#60a5fa",borderRadius:10,padding:"2px 8px"}}>{month.visits.length} visit{month.visits.length!==1?"s":""}</span>
                  </div>
                  {month.visits.map((v,i)=>{
                    const d=new Date(v.date+"T12:00:00");
                    const label=d.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"});
