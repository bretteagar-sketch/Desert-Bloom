// ── GOOGLE SHEETS API ─────────────────────────────────────────────────────────
const DB = {
  async post(body) {
    try {
      // Try with cors first, fall back to no-cors
      const res = await fetch(SHEETS_URL, {
        method:"POST",
        headers:{"Content-Type":"text/plain"},
        body:JSON.stringify(body),
      });
      try { const j = await res.json(); return j; } catch { return {success:true}; }
    } catch {
      // Fallback no-cors
      try {
        await fetch(SHEETS_URL, { method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain"}, body:JSON.stringify(body) });
      } catch {}
      return {success:true};
    }
  },
  async getAll() {
    try {
      const res = await fetch(`${SHEETS_URL}?t=${Date.now()}`);
      const json = await res.json();
      return json.success ? json.data : null;
    } catch { return null; }
  },
  async set(sheet, payload) {
    return this.post({sheet, action:"set", payload});
  },
  async append(sheet, payload) {
    return this.post({sheet, action:"append", payload});
  },
  async setConfig(key, value) {
    return this.post({sheet:"config", action:"set", payload:{key, value}});
  },
  async getConfig(key) {
    try {
      const res = await fetch(`${SHEETS_URL}?sheet=config&t=${Date.now()}`);
      const json = await res.json();
      if (!json.success) return null;
      const row = json.data.find(r=>r.Key===key);
      if (row) return JSON.parse(row.Value);
    } catch {}
    return null;
  },
};

// ── TWILIO ────────────────────────────────────────────────────────────────────
async function sendSMS(to, body, cfg) {
  const res = await fetch(`https://api.twilio.com/2010-04-01/Accounts/${cfg.sid}/Messages.json`, {
    method:"POST",
    headers:{"Authorization":"Basic "+btoa(`${cfg.sid}:${cfg.token}`),"Content-Type":"application/x-www-form-urlencoded"},
    body:new URLSearchParams({To:to,From:cfg.from,Body:body}).toString(),
  });
  const data = await res.json();
  if(!res.ok) throw new Error(data.message||"Twilio error");
  return data;
}

function Gauge({label,val,type,unit}){
  const s=cStat(val,type),r=CR[type]||[0,10];
  const pct=Math.min(100,Math.max(0,((val-r[0])/(r[1]-r[0]))*100));
  const c={ok:"#22c55e",low:"#ef4444",high:"#f5a623"}[s];
  return(
    <div style={{background:"#111827",borderRadius:10,padding:"10px 12px"}}>
      <div style={{display:"flex",justifyContent:"space-between",marginBottom:5}}>
        <span style={{fontSize:11,color:"#6b7280"}}>{label}</span>
        <span style={{fontSize:12,fontWeight:700,color:c}}>{val}{unit} {s!=="ok"?`(${s})`:"✓"}</span>
      </div>
      <div style={{background:"#1f2937",borderRadius:99,height:5}}>
        <div style={{width:`${pct}%`,height:"100%",borderRadius:99,background:c}}/>
      </div>
    </div>
  );
}

// ── SERVICE VISIT ─────────────────────────────────────────────────────────────
const CHECKLIST=[
  {id:"brush",  label:"Brush Walls & Steps",icon:"🪣"},
  {id:"skim",   label:"Skim / Net Surface",  icon:"🕸️"},
  {id:"skimmer",label:"Skimmer Basket",      icon:"🧺"},
  {id:"pump",   label:"Pump Basket",         icon:"⚙️"},
  {id:"filter", label:"Cleaned Filter",      icon:"🔵",isFilter:true},
];

function ServiceVisit({pool,filterEvery,twilio,currentUser,onComplete,onBack,onLogVisit}){
  const [step,setStep]=useState("start");
  const [elapsed,setElapsed]=useState(0);
  const [running,setRunning]=useState(false);
  const timerRef=useRef();
  const [beforePhotos,setBeforePhotos]=useState([]);
  const [afterPhotos,setAfterPhotos]=useState([]);
  const [chem,setChem]=useState({ph:"",chlorine:"",alkalinity:"",calcium:"",salt:"",notes:""});
  const [checks,setChecks]=useState({});
  const [filterDone,setFilterDone]=useState(false);
  const [finishing,setFinishing]=useState(false);

  const filterDue=pool.filterVisits>=filterEvery;
  const required=CHECKLIST.filter(i=>!i.isFilter||filterDue);
  const allDone=required.every(i=>i.isFilter?filterDone:!!checks[i.id]);

  useEffect(()=>{
    if(running) timerRef.current=setInterval(()=>setElapsed(e=>e+1),1000);
    else clearInterval(timerRef.current);
    return()=>clearInterval(timerRef.current);
  },[running]);

  const finish=async()=>{
    setRunning(false);
    setFinishing(true);
    const ph=parseFloat(chem.ph)||pool.ph;
    const cl=parseFloat(chem.chlorine)||pool.chlorine;
    const alk=parseFloat(chem.alkalinity)||pool.alkalinity;
    const cal=parseFloat(chem.calcium)||pool.calcium;
    const updated={...pool,ph,chlorine:cl,alkalinity:alk,calcium:cal,notes:chem.notes||pool.notes,status:"Completed",lastService:todayStr(),photos:[...pool.photos,...beforePhotos],afterPhotos:[...afterPhotos],visits:pool.visits+1,filterVisits:filterDone?0:pool.filterVisits+1,lastDuration:elapsed};

    // Log visit to Sheets
    onLogVisit({customer:pool.customer,tech:currentUser.name,duration:elapsed,ph,chlorine:cl,alkalinity:alk,calcium:cal,notes:chem.notes,filterCleaned:filterDone,beforePhotos:beforePhotos.length,afterPhotos:afterPhotos.length});

    // Send completion text
    if(twilio?.sid&&pool.phone){
      const body=`Hi ${pool.customer.split(" ")[0]}! ✅ Your Desert Bloom pool service is complete!\n\n💧 Chemistry:\n• pH: ${ph}\n• Chlorine: ${cl} ppm\n• Alkalinity: ${alk} ppm\n\nDuration: ${fmtTime(elapsed)}\n🌸 — Desert Bloom`;
      try{ await sendSMS(pool.phone,body,twilio); }catch{}
    }
    setFinishing(false);
    onComplete(updated);
    setStep("done");
  };

  if(step==="done") return(
    <div style={{fontFamily:"sans-serif",background:"#060d1a",minHeight:"100vh",color:"#e2e8f0",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:24}}>
      <div style={{fontSize:60,marginBottom:12}}>✅</div>
      <div style={{fontSize:22,fontWeight:800,color:"#22c55e",marginBottom:6}}>Visit Complete!</div>
      <div style={{fontSize:14,color:"#6b7280",marginBottom:4}}>{pool.customer}</div>
      <div style={{fontSize:13,color:"#94a3b8",marginBottom:20}}>Duration: {fmtTime(elapsed)}</div>
      <button onClick={onBack} style={{background:"linear-gradient(135deg,#3b82f6,#06b6d4)",border:"none",borderRadius:14,padding:"14px 32px",fontSize:15,fontWeight:700,color:"#fff",cursor:"pointer"}}>← Back to Route</button>
    </div>
  );

  const stepList=["before_photos","chemicals","checklist","after_photos"];
  const stepIdx=stepList.indexOf(step);

  return(
    <div style={{fontFamily:"sans-serif",background:"#060d1a",minHeight:"100vh",color:"#e2e8f0",paddingBottom:30}}>
      <div style={{background:"#0a1628",borderBottom:"1px solid rgba(59,130,246,0.15)",padding:"13px 16px"}}>
        {step==="start"&&<button onClick={onBack} style={{background:"rgba(59,130,246,0.1)",border:"1px solid rgba(59,130,246,0.2)",borderRadius:8,padding:"6px 12px",fontSize:12,color:"#60a5fa",cursor:"pointer",marginBottom:10}}>← Back</button>}
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div><div style={{fontWeight:700,fontSize:15}}>Service Visit</div><div style={{fontSize:12,color:"#6b7280"}}>{pool.customer}</div></div>
          {elapsed>0&&<div style={{fontFamily:"monospace",fontSize:20,fontWeight:800,color:"#60a5fa"}}>{fmtTime(elapsed)}</div>}
        </div>
        {running&&<div style={{display:"flex",alignItems:"center",gap:6,marginTop:6}}><div style={{width:7,height:7,borderRadius:50,background:"#22c55e",boxShadow:"0 0 6px #22c55e"}}/><span style={{fontSize:11,color:"#94a3b8"}}>In progress</span></div>}
      </div>

      {step!=="start"&&<div style={{display:"flex",gap:4,padding:"10px 16px 0"}}>{stepList.map((s,i)=><div key={s} style={{flex:1,height:4,borderRadius:99,background:stepIdx>i?"#22c55e":stepIdx===i?"#3b82f6":"#1f2937"}}/>)}</div>}

      <div style={{padding:"16px"}}>
        {step==="start"&&(
          <>
            <div style={{textAlign:"center",padding:"12px 0 10px"}}>
              <div style={{fontSize:40,marginBottom:8}}>🏊</div>
              <div style={{fontSize:19,fontWeight:800,marginBottom:4}}>{pool.customer}</div>
              <button onClick={()=>openMaps(pool.address)} style={{fontSize:13,color:"#60a5fa",background:"none",border:"none",cursor:"pointer",textDecoration:"underline"}}>📍 {pool.address.split(",")[0]}</button>
            </div>
            <Card style={{marginBottom:12}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                <div style={{fontSize:13,fontWeight:700}}>🔵 Filter Tally</div>
                {filterDue?<span style={{background:"rgba(239,68,68,0.15)",color:"#ef4444",fontSize:11,fontWeight:700,padding:"3px 9px",borderRadius:20}}>DUE THIS VISIT</span>:<span style={{fontSize:12,color:"#6b7280"}}>{filterEvery-pool.filterVisits} visits until due</span>}
              </div>

            <div style={{fontSize:13,color:"#6b7280",marginBottom:14}}>Capture pool condition before starting</div>
            <Card style={{marginBottom:14}}><Photos photos={beforePhotos} onAdd={p=>setBeforePhotos(v=>[...v,p])} label="Before Photos"/></Card>
            <button onClick={()=>setStep("chemicals")} style={{width:"100%",background:"linear-gradient(135deg,#3b82f6,#06b6d4)",border:"none",borderRadius:14,padding:"14px",fontSize:15,fontWeight:700,color:"#fff",cursor:"pointer",marginBottom:8}}>Next: Chemicals →</button>
            <button onClick={()=>setStep("chemicals")} style={{width:"100%",background:"none",border:"none",color:"#6b7280",fontSize:13,cursor:"pointer"}}>Skip photos</button>
          </>
        )}
        {step==="chemicals"&&(
          <>
            <div style={{fontSize:16,fontWeight:700,marginBottom:4}}>⚗️ Chemical Readings</div>
            <div style={{fontSize:13,color:"#6b7280",marginBottom:14}}>Log today's water chemistry</div>
            <Card style={{marginBottom:14}}>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>
                {[["pH","ph","7.4"],["Chlorine (ppm)","chlorine","2.0"],["Alkalinity (ppm)","alkalinity","100"],["Calcium (ppm)","calcium","250"]].map(([l,k,ph])=>(
                  <div key={k}><div style={{fontSize:11,color:"#6b7280",marginBottom:4}}>{l}</div><input value={chem[k]} onChange={e=>setChem(v=>({...v,[k]:e.target.value}))} placeholder={ph} style={{width:"100%",background:"#111827",border:"1px solid rgba(255,255,255,0.08)",borderRadius:8,padding:"9px 10px",fontSize:13,color:"#e2e8f0",outline:"none",boxSizing:"border-box"}}/></div>
                ))}
              </div>
              {pool.salt&&<div style={{marginBottom:10}}><div style={{fontSize:11,color:"#6b7280",marginBottom:4}}>SALT (PPM)</div><input value={chem.salt} onChange={e=>setChem(v=>({...v,salt:e.target.value}))} placeholder="3200" style={{width:"100%",background:"#111827",border:"1px solid rgba(255,255,255,0.08)",borderRadius:8,padding:"9px 10px",fontSize:13,color:"#e2e8f0",outline:"none",boxSizing:"border-box"}}/></div>}
              <div><div style={{fontSize:11,color:"#6b7280",marginBottom:4}}>CHEMICALS ADDED / NOTES</div><textarea value={chem.notes} onChange={e=>setChem(v=>({...v,notes:e.target.value}))} placeholder="e.g. Added 2 lbs shock..." style={{width:"100%",background:"#111827",border:"1px solid rgba(255,255,255,0.08)",borderRadius:8,padding:"9px 10px",fontSize:13,color:"#e2e8f0",outline:"none",resize:"none",height:70,boxSizing:"border-box"}}/></div>
            </Card>
            <button onClick={()=>setStep("checklist")} style={{width:"100%",background:"linear-gradient(135deg,#3b82f6,#06b6d4)",border:"none",borderRadius:14,padding:"14px",fontSize:15,fontWeight:700,color:"#fff",cursor:"pointer"}}>Next: Checklist →</button>
          </>
        )}
        {step==="checklist"&&(
          <>
            <div style={{fontSize:16,fontWeight:700,marginBottom:4}}>✅ Service Checklist</div>
            <div style={{fontSize:13,color:"#6b7280",marginBottom:14}}>Check off each completed task</div>
            <Card style={{padding:"4px 16px",marginBottom:14}}>
              {CHECKLIST.map(item=>{
                const due=!item.isFilter||filterDue;
                const checked=item.isFilter?filterDone:!!checks[item.id];
                return(
                  <div key={item.id} onClick={()=>due&&(item.isFilter?setFilterDone(v=>!v):setChecks(v=>({...v,[item.id]:!v[item.id]})))} style={{display:"flex",alignItems:"center",gap:12,padding:"13px 0",borderBottom:"1px solid rgba(255,255,255,0.04)",cursor:due?"pointer":"default",opacity:due?1:0.35}}>
                    <div style={{width:26,height:26,borderRadius:7,background:checked?"#22c55e":"#1f2937",border:`2px solid ${checked?"#22c55e":"rgba(255,255,255,0.1)"}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:14,color:"#fff",fontWeight:700,flexShrink:0}}>{checked?"✓":""}</div>
                    <div style={{flex:1}}>
                      <div style={{fontSize:15,fontWeight:600,color:checked?"#22c55e":"#e2e8f0"}}>{item.icon} {item.label}</div>
                      {item.isFilter&&filterDue&&<div style={{fontSize:11,color:"#ef4444",marginTop:2}}>🔴 Due — tally resets to 0</div>}
                      {item.isFilter&&!filterDue&&<div style={{fontSize:11,color:"#374151"}}>Not due — {filterEvery-pool.filterVisits} visits left</div>}
                    </div>
                  </div>
                );
              })}
            </Card>
            <div style={{fontSize:12,color:allDone?"#22c55e":"#6b7280",textAlign:"center",marginBottom:10}}>{allDone?"✓ All tasks done!": `${Object.values(checks).filter(Boolean).length+(filterDone?1:0)} / ${required.length} tasks`}</div>
            <button onClick={()=>setStep("after_photos")} disabled={!allDone} style={{width:"100%",background:allDone?"linear-gradient(135deg,#3b82f6,#06b6d4)":"#1f2937",border:"none",borderRadius:14,padding:"14px",fontSize:15,fontWeight:700,color:allDone?"#fff":"#374151",cursor:allDone?"pointer":"not-allowed"}}>Next: After Photos →</button>
          </>
        )}
        {step==="after_photos"&&(
          <>
            <div style={{fontSize:16,fontWeight:700,marginBottom:4}}>📷 After Photos</div>
            <div style={{fontSize:13,color:"#6b7280",marginBottom:14}}>Show the finished result</div>
            <Card style={{marginBottom:14}}><Photos photos={afterPhotos} onAdd={p=>setAfterPhotos(v=>[...v,p])} label="After Photos"/></Card>
            <button onClick={finish} disabled={finishing} style={{width:"100%",background:finishing?"#1f2937":"linear-gradient(135deg,#22c55e,#16a34a)",border:"none",borderRadius:14,padding:"15px",fontSize:15,fontWeight:700,color:finishing?"#6b7280":"#fff",cursor:finishing?"not-allowed":"pointer",marginBottom:8}}>
              {finishing?"⏳ Finishing...":"✓ Complete Visit"}
            </button>
            <button onClick={finish} disabled={finishing} style={{width:"100%",background:"none",border:"none",color:"#6b7280",fontSize:13,cursor:"pointer"}}>Skip after photos & finish</button>
          </>
        )}
      </div>
    </div>
  );
}

    </div>

// ── CUSTOMER FORM ─────────────────────────────────────────────────────────────
function CustomerForm({existing,users,onSave,onBack}){
  const techs=users.filter(u=>u.role==="tech");
  const blank={customer:"",phone:"",address:"",type:"Residential",size:"",tech:techs[0]?.id||"",notes:"",equipment:"",salt:false,monthlyRate:"",serviceDay:"Monday"};
  const [f,setF]=useState(existing?{...existing,equipment:(existing.equipment||[]).join(", "),salt:!!existing.salt,monthlyRate:existing.monthlyRate||""}:blank);
  const [err,setErr]=useState({});
  const [done,setDone]=useState(false);
  const s=(k,v)=>setF(x=>({...x,[k]:v}));

  const save=()=>{
    const e={};
    if(!f.customer.trim()) e.customer="Required";
    if(!f.address.trim()) e.address="Required";
    if(!f.phone.trim()) e.phone="Required";
    setErr(e);
    if(Object.keys(e).length) return;
    const pool={id:existing?.id||Date.now(),customer:f.customer.trim(),phone:f.phone.trim().startsWith("+")?f.phone.trim():"+1"+f.phone.trim().replace(/\D/g,""),address:f.address.trim(),lat:33.5,lng:-111.9,type:f.type,size:f.size||"Unknown",status:existing?.status||"Scheduled",lastService:existing?.lastService||"Never",tech:f.tech,ph:existing?.ph||7.4,chlorine:existing?.chlorine||2.0,alkalinity:existing?.alkalinity||100,calcium:existing?.calcium||250,salt:f.salt?(existing?.salt||3200):null,notes:f.notes.trim(),equipment:f.equipment.split(",").map(e=>e.trim()).filter(Boolean),photos:existing?.photos||[],afterPhotos:existing?.afterPhotos||[],order:existing?.order||999,visits:existing?.visits||0,filterVisits:existing?.filterVisits||0,monthlyRate:parseFloat(f.monthlyRate)||0,serviceDay:f.serviceDay};
    onSave(pool);
    setDone(true);
    setTimeout(()=>{setDone(false);onBack();},1500);
  };

  return(
    <div style={{fontFamily:"sans-serif",background:"#060d1a",minHeight:"100vh",color:"#e2e8f0",paddingBottom:40}}>
      <PageHeader onBack={onBack} title={existing?"Edit Customer":"Add New Customer"}/>
      <div style={{padding:"16px"}}>
        {done&&<div style={{background:"rgba(34,197,94,0.1)",border:"1px solid rgba(34,197,94,0.3)",borderRadius:12,padding:"14px",textAlign:"center",color:"#22c55e",fontWeight:700,marginBottom:16}}>✓ {existing?"Saved!":"Customer added!"}</div>}
        <Card style={{marginBottom:14}}>
          <div style={{fontSize:13,fontWeight:700,marginBottom:12}}>👤 Customer Info</div>
          <Inp label="FULL NAME" value={f.customer} onChange={v=>s("customer",v)} placeholder="John Smith" error={err.customer}/>
          <Inp label="PHONE" value={f.phone} onChange={v=>s("phone",v)} placeholder="(480) 555-1234" type="tel" error={err.phone}/>
          <Inp label="ADDRESS" value={f.address} onChange={v=>s("address",v)} placeholder="123 Main St, Scottsdale, AZ" error={err.address}/>
          <div style={{marginBottom:12}}><div style={{fontSize:11,color:"#6b7280",marginBottom:4,letterSpacing:1}}>NOTES / GATE CODE</div><textarea value={f.notes} onChange={e=>s("notes",e.target.value)} placeholder="Gate code, dogs, special instructions..." style={{width:"100%",background:"#111827",border:"1px solid rgba(255,255,255,0.08)",borderRadius:9,padding:"10px 13px",fontSize:13,color:"#e2e8f0",outline:"none",resize:"none",height:70,boxSizing:"border-box"}}/></div>
        </Card>
        <Card style={{marginBottom:14}}>
          <div style={{fontSize:13,fontWeight:700,marginBottom:12}}>🏊 Pool & Service Info</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:0}}>
            <Sel label="TYPE" value={f.type} onChange={v=>s("type",v)}><option>Residential</option><option>Commercial</option></Sel>
            <Inp label="SIZE" value={f.size} onChange={v=>s("size",v)} placeholder="15,000 gal"/>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
            <Inp label="MONTHLY RATE ($)" value={f.monthlyRate} onChange={v=>s("monthlyRate",v)} placeholder="149" type="number"/>
            <Sel label="SERVICE DAY" value={f.serviceDay} onChange={v=>s("serviceDay",v)}>
              {["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"].map(d=><option key={d}>{d}</option>)}
            </Sel>
          </div>
          <Sel label="ASSIGN TO TECH" value={f.tech} onChange={v=>s("tech",v)}>{techs.map(t=><option key={t.id} value={t.id}>{t.name}</option>)}</Sel>
          <Inp label="EQUIPMENT (comma separated)" value={f.equipment} onChange={v=>s("equipment",v)} placeholder="Hayward Pump, Pentair Filter"/>
          <div onClick={()=>s("salt",!f.salt)} style={{display:"flex",alignItems:"center",gap:10,cursor:"pointer",padding:"6px 0"}}>
            <div style={{width:24,height:24,borderRadius:6,background:f.salt?"#3b82f6":"#111827",border:`2px solid ${f.salt?"#3b82f6":"rgba(255,255,255,0.1)"}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,color:"#fff"}}>{f.salt?"✓":""}</div>
            <span style={{fontSize:14}}>Salt Water Pool (SWG)</span>
          </div>
        </Card>
        <button onClick={save} style={{width:"100%",background:"linear-gradient(135deg,#3b82f6,#06b6d4)",border:"none",borderRadius:14,padding:"15px",fontSize:15,fontWeight:700,color:"#fff",cursor:"pointer"}}>{existing?"Save Changes":"➕ Add Customer"}</button>
      </div>
    </div>
  );
}

// ── USER MANAGER ──────────────────────────────────────────────────────────────
function UserManager({users,onSave,onBack}){
  const [list,setList]=useState(users);
  const [editing,setEditing]=useState(null);
  const [form,setForm]=useState({name:"",role:"tech",password:"",phone:""});
  const [saved,setSaved]=useState(false);

  const saveUser=()=>{
    if(!form.name.trim()||!form.password.trim()) return;
    const u=editing?{...editing,...form,name:form.name.trim()}:{id:Date.now().toString(),name:form.name.trim(),role:form.role,password:form.password,phone:form.phone};
    const updated=editing?list.map(x=>x.id===editing.id?u:x):[...list,u];
    setList(updated);onSave(updated);
    setEditing(null);setForm({name:"",role:"tech",password:"",phone:""});
    setSaved(true);setTimeout(()=>setSaved(false),2000);
  };

  return(
    <div style={{fontFamily:"sans-serif",background:"#060d1a",minHeight:"100vh",color:"#e2e8f0",paddingBottom:40}}>
      <PageHeader onBack={onBack} title="👥 User Management"/>
      <div style={{padding:"16px"}}>
        {saved&&<div style={{background:"rgba(34,197,94,0.1)",border:"1px solid rgba(34,197,94,0.3)",borderRadius:10,padding:"10px 14px",color:"#22c55e",fontWeight:600,fontSize:13,marginBottom:14}}>✓ Saved & synced!</div>}
        <Card style={{marginBottom:16}}>
          <div style={{fontSize:13,fontWeight:700,marginBottom:12}}>{editing?"✏️ Edit User":"➕ Add New User"}</div>
          <Inp label="NAME" value={form.name} onChange={v=>setForm(f=>({...f,name:v}))} placeholder="Full name"/>
          <Sel label="ROLE" value={form.role} onChange={v=>setForm(f=>({...f,role:v}))}><option value="tech">Technician</option><option value="owner">Owner</option></Sel>
          <Inp label="PASSWORD" value={form.password} onChange={v=>setForm(f=>({...f,password:v}))} placeholder="Password" type="password"/>
          <Inp label="PHONE" value={form.phone} onChange={v=>setForm(f=>({...f,phone:v}))} placeholder="(480) 555-1234" type="tel"/>
          <div style={{display:"flex",gap:8}}>
            {editing&&<button onClick={()=>{setEditing(null);setForm({name:"",role:"tech",password:"",phone:""}); }} style={{flex:1,background:"#111827",border:"1px solid rgba(255,255,255,0.08)",borderRadius:10,padding:"11px",fontSize:13,color:"#9ca3af",cursor:"pointer"}}>Cancel</button>}
            <button onClick={saveUser} style={{flex:2,background:"linear-gradient(135deg,#3b82f6,#06b6d4)",border:"none",borderRadius:10,padding:"11px",fontSize:14,fontWeight:700,color:"#fff",cursor:"pointer"}}>{editing?"Save Changes":"Add User"}</button>
          </div>
        </Card>
        <div style={{fontSize:12,fontWeight:700,color:"#6b7280",marginBottom:8,letterSpacing:1}}>CURRENT USERS ({list.length})</div>
        {list.map(u=>(
          <div key={u.id} style={{background:"#0d1626",borderRadius:13,padding:"13px 14px",marginBottom:8,border:"1px solid rgba(255,255,255,0.05)",display:"flex",alignItems:"center",gap:12}}>

}

// ── ROUTE LIST ────────────────────────────────────────────────────────────────
function RouteList({pools,onReorder,onSelect,techFilter,setTechFilter,users,showFilter=true}){
  const [dragging,setDragging]=useState(null);
  const [over,setOver]=useState(null);
  const sorted=[...pools].sort((a,b)=>(a.order||99)-(b.order||99));
  const techs=users.filter(u=>u.role==="tech");
  const drop=(e,tid)=>{ e.preventDefault(); if(dragging===tid){setDragging(null);setOver(null);return;} const fi=sorted.findIndex(p=>p.id===dragging),ti=sorted.findIndex(p=>p.id===tid); const re=[...sorted];const[m]=re.splice(fi,1);re.splice(ti,0,m); onReorder(re.map((p,i)=>({...p,order:i+1}))); setDragging(null);setOver(null); };
  return(
    <div style={{padding:"14px 16px"}}>
      <div style={{fontSize:17,fontWeight:700,marginBottom:2}}>Route Planner</div>

            </div>

              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}><div style={{fontWeight:600,fontSize:14}}>{pool.customer}</div><Badge status={pool.status}/></div>
              <button onClick={e=>{e.stopPropagation();openMaps(pool.address);}} style={{fontSize:12,color:"#60a5fa",background:"none",border:"none",cursor:"pointer",padding:0,textDecoration:"underline",textAlign:"left",marginBottom:6}}>📍 {pool.address.split(",")[0]}</button>

// ── MAIN APP ──────────────────────────────────────────────────────────────────
function DesertBloom(){
  const [loading,setLoading]=useState(true);
  const [syncStatus,setSyncStatus]=useState(null); // null | "syncing" | "synced"
  const [users,setUsers]     =useState(DEFAULT_USERS);
  const [pools,setPools]     =useState(DEFAULT_POOLS);
  const [invoices,setInvoices]=useState(DEFAULT_INVOICES);
  const [filterEvery,setFilterEvery]=useState(FILTER_DEFAULT);
  const [twilio,setTwilio]   =useState({sid:"",token:"",from:"+14805715896"});
  const [smsLog,setSmsLog]   =useState([]);
  const [user,setUser]       =useState(()=>lsGet("db_session",null));
  const [loginCreds,setLoginCreds]=useState({u:"",p:""});
  const [loginErr,setLoginErr]=useState("");
  const [ownerTab,setOwnerTab]=useState("overview");
  const [techTab,setTechTab] =useState("day");
  const [selPool,setSelPool] =useState(null);
  const [visitPool,setVisitPool]=useState(null);
  const [addCustomer,setAddCustomer]=useState(null);
  const [showUsers,setShowUsers]=useState(false);
  const [routeFilter,setRouteFilter]=useState("all");
  const [optimizing,setOptimizing]=useState(false);
  const [sending,setSending] =useState({});
  const [remindersSent,setRemindersSent]=useState({});
  const [twilioSaved,setTwilioSaved]=useState(false);
  const [filterSaved,setFilterSaved]=useState(false);

  // Load all data from Google Sheets on mount
  useEffect(()=>{
    DB.getAll().then(data=>{
      if(data){
        // Parse config
        if(data.config){
          const tw=data.config.find(r=>r.Key==="twilio");
          if(tw) try{setTwilio(JSON.parse(tw.Value));}catch{}
          const fe=data.config.find(r=>r.Key==="filterEvery");
          if(fe) try{setFilterEvery(JSON.parse(fe.Value));}catch{}
        }
        // Parse pools
        if(data.pools&&data.pools.length){
          try{
            const p=data.pools.map(r=>r["JSON Data"]?JSON.parse(r["JSON Data"]):r).filter(Boolean);
            if(p.length) setPools(p);
          }catch{}
        }
        // Parse users
        if(data.users&&data.users.length){
          try{
            const u=data.users.map(r=>({id:r.ID,name:r.Name,role:r.Role,password:r.Password,phone:r.Phone})).filter(u=>u.id&&u.name);
            if(u.length) setUsers(u);
          }catch{}
        }
        // Parse invoices
        if(data.invoices&&data.invoices.length){
          try{
            const inv=data.invoices.map(r=>({id:r.ID,customer:r.Customer,amount:parseFloat(r.Amount)||0,serviceDate:r["Service Date"],status:r.Status,paidDate:r["Paid Date"]||"",notes:r.Notes||""})).filter(i=>i.customer);
            if(inv.length) setInvoices(inv);
          }catch{}
        }
      }
      setLoading(false);
    }).catch(()=>setLoading(false));
  },[]);

  // Auto reminders once per day
  useEffect(()=>{
    if(!twilio.sid||loading) return;
    const lastCheck=lsGet("db_lastReminder","");
    const todayKey=new Date().toDateString();
    if(lastCheck===todayKey) return;
    lsSet("db_lastReminder",todayKey);
    pools.filter(p=>p.status==="Due Today"||p.status==="Scheduled").forEach(pool=>{
      const first=pool.customer.split(" ")[0];
      const body=`Hi ${first}! Just a reminder your Desert Bloom pool service is coming up soon. 🌸 — Desert Bloom`;
      sendSMS(pool.phone,body,twilio).then(()=>{
        const entry={customer:pool.customer,phone:pool.phone,body,type:"reminder",status:"sent",time:new Date().toLocaleTimeString()};
        setSmsLog(l=>[...l,entry]);
        DB.append("smslog",entry);
      }).catch(()=>{});
    });
  },[twilio.sid,loading]);

  const sync=async(key,data)=>{
    setSyncStatus("syncing");
    await DB.set(key,data);
    setSyncStatus("synced");
    setTimeout(()=>setSyncStatus(null),2000);
  };

  const upUsers=useCallback((u,currentUser)=>{
    setUsers(u);
    // If the logged-in user was edited, update their session too
    const updatedSelf = u.find(x=>x.id===currentUser?.id);
    if(updatedSelf){ setUser(updatedSelf); lsSet("db_session",updatedSelf); }
    sync("users",u);
  },[]);
  const upPools=useCallback(p=>{setPools(p);sync("pools",p);},[]);
  const upInvoices=useCallback(inv=>{setInvoices(inv);sync("invoices",inv);},[]);
  const upPool=useCallback(u=>{setPools(p=>p.map(x=>x.id===u.id?u:x));setSelPool(u);sync("pools",pools.map(x=>x.id===u.id?u:x));},[pools]);

  const doSend=async(pool,type)=>{
    const key=`${pool.id}_${type}`;
    if(!twilio.sid||!twilio.token){alert("⚠️ Set up Twilio in Settings first");return;}
    const first=pool.customer.split(" ")[0];
    const body=type==="onmyway"?`Hi ${first}! Your Desert Bloom pool tech is on the way! 🌸 Thanks!`:`Hi ${first}! Reminder: your Desert Bloom pool service is coming up soon. 🌸 — Desert Bloom`;
    setSending(s=>({...s,[key]:true}));
    try{
      await sendSMS(pool.phone,body,twilio);
      const entry={customer:pool.customer,phone:pool.phone,body,type,status:"sent",time:new Date().toLocaleTimeString()};
      setSmsLog(l=>[...l,entry]);DB.append("smslog",entry);
      if(type==="reminder") setRemindersSent(r=>({...r,[pool.id]:true}));
    }catch(e){
      const entry={customer:pool.customer,phone:pool.phone,body,type,status:"failed",error:e.message,time:new Date().toLocaleTimeString()};
      setSmsLog(l=>[...l,entry]);DB.append("smslog",entry);
      alert(`❌ Send failed: ${e.message}`);
    }
    setSending(s=>({...s,[key]:false}));
  };

  const nn=(pts)=>{ if(pts.length<=1)return pts; const res=[pts[0]],rem=[...pts.slice(1)]; while(rem.length){const last=res[res.length-1];let bi=0,bd=Infinity;rem.forEach((p,i)=>{const d=Math.hypot(p.lat-last.lat,p.lng-last.lng);if(d<bd){bd=d;bi=i;}});res.push(rem[bi]);rem.splice(bi,1);} return res; };
  const optimize=(subset)=>{setOptimizing(true);setTimeout(()=>{const opt=nn(subset).map((p,i)=>({...p,order:i+1}));const merged=[...pools.filter(p=>!subset.find(s=>s.id===p.id)),...opt];upPools(merged);setOptimizing(false);},1200);};

  const doLogin=()=>{
    const u=users.find(u=>(u.name.toLowerCase().replace(/\s/g,"")===(loginCreds.u.toLowerCase().replace(/\s/g,""))||u.id?.toLowerCase()===loginCreds.u.toLowerCase())&&u.password===loginCreds.p);
    if(u){setUser(u);lsSet("db_session",u);setLoginErr("");}
    else setLoginErr("Wrong username or password.");
  };
  const logout=()=>{setUser(null);lsSet("db_session",null);};

  const saveTwilio=async(cfg)=>{
    setTwilio(cfg);
    await DB.setConfig("twilio",cfg);
    setTwilioSaved(true);setTimeout(()=>setTwilioSaved(false),3000);
  };

  // ── LOADING ──
  if(loading) return(
    <div style={{fontFamily:"sans-serif",background:"#060d1a",minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",color:"#e2e8f0"}}>

              <div key={k} style={{marginBottom:12}}>
                <div style={{fontSize:11,color:"#6b7280",marginBottom:4,letterSpacing:1}}>{l}</div>
                <input type={type} value={twilio[k]} onChange={e=>setTwilio(v=>({...v,[k]:e.target.value}))} placeholder={ph} style={{width:"100%",background:"#111827",border:"1px solid rgba(255,255,255,0.08)",borderRadius:9,padding:"10px 13px",fontSize:13,color:"#e2e8f0",outline:"none",boxSizing:"border-box",fontFamily:"monospace"}}/>
              </div>
            ))}
            <button onClick={()=>saveTwilio(twilio)} style={{width:"100%",background:"linear-gradient(135deg,#3b82f6,#06b6d4)",border:"none",borderRadius:12,padding:"12px",fontSize:14,fontWeight:700,color:"#fff",cursor:"pointer"}}>Save to Google Sheets</button>
            {twilioSaved&&<div style={{marginTop:10,background:"rgba(34,197,94,0.1)",border:"1px solid rgba(34,197,94,0.3)",borderRadius:10,padding:"10px",textAlign:"center",color:"#22c55e",fontWeight:700,fontSize:13}}>✓ Saved to Google Sheets!</div>}
          </Card>
          <Card style={{marginBottom:14}}>
            <div style={{fontSize:13,fontWeight:700,marginBottom:4}}>🔵 Filter Cleaning Schedule</div>
            <div style={{fontSize:12,color:"#6b7280",marginBottom:12}}>Visits between filter cleanings</div>
            <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:12}}>
              <input type="number" value={filterEvery} onChange={e=>setFilterEvery(parseInt(e.target.value)||20)} min="1" max="100" style={{width:80,background:"#111827",border:"1px solid rgba(255,255,255,0.08)",borderRadius:9,padding:"10px 13px",fontSize:18,fontWeight:700,color:"#f5a623",outline:"none",textAlign:"center",boxSizing:"border-box"}}/>
              <div style={{fontSize:14,color:"#d1d5db"}}>visits between cleanings</div>
            </div>
            <button onClick={()=>{lsSet("db_filterEvery",filterEvery);DB.setConfig("filterEvery",filterEvery);setFilterSaved(true);setTimeout(()=>setFilterSaved(false),2000);}} style={{width:"100%",background:"linear-gradient(135deg,#f5a623,#e07b00)",border:"none",borderRadius:12,padding:"12px",fontSize:14,fontWeight:700,color:"#fff",cursor:"pointer"}}>Save Schedule</button>
            {filterSaved&&<div style={{marginTop:10,background:"rgba(34,197,94,0.1)",border:"1px solid rgba(34,197,94,0.3)",borderRadius:10,padding:"10px",textAlign:"center",color:"#22c55e",fontWeight:700,fontSize:13}}>✓ Saved!</div>}
          </Card>
          <Card style={{marginBottom:14}}>
            <div style={{fontSize:13,fontWeight:700,marginBottom:4}}>👥 User Management</div>
            <div style={{fontSize:12,color:"#6b7280",marginBottom:12}}>{users.length} users — stays signed in until logout</div>
            <button onClick={()=>setShowUsers(true)} style={{width:"100%",background:"rgba(59,130,246,0.1)",border:"1px solid rgba(59,130,246,0.2)",borderRadius:12,padding:"12px",fontSize:14,fontWeight:600,color:"#60a5fa",cursor:"pointer"}}>Manage Users →</button>
          </Card>
        </div>
      ),
    };

    return <AppShell subtitle="Owner Dashboard" nav={<TopNav tabs={ownerTabs} active={ownerTab} onChange={setOwnerTab}/>} content={tabContent[ownerTab]}/>;
  }

  // ── TECH ──
  const myPools=pools.filter(p=>p.tech===user.id).sort((a,b)=>(a.order||99)-(b.order||99));
  const remaining=myPools.filter(p=>p.status!=="Completed");
  const doneMy=myPools.filter(p=>p.status==="Completed");
  const next=remaining[0];
  const techTabs=[{id:"day",label:"My Day",icon:"⬡"},{id:"route",label:"Route",icon:"🗺️"},{id:"customers",label:"Customers",icon:"👤"},{id:"done",label:"Done",icon:"✓"}];

  const techContent={
    day:(
      <div style={{padding:"16px"}}>
        <div style={{fontSize:18,fontWeight:700,marginBottom:2}}>Hey {user.name.split(" ")[0]} 👋</div>
        <div style={{fontSize:13,color:"#4b5563",marginBottom:14}}>{remaining.length} stops remaining · {todayStr()}</div>
        <Card style={{marginBottom:14}}>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}><span style={{fontSize:13,color:"#9ca3af"}}>Progress</span><span style={{fontSize:14,fontWeight:700,color:"#22c55e"}}>{doneMy.length}/{myPools.length}</span></div>
          <div style={{background:"#111827",borderRadius:99,height:10,overflow:"hidden"}}><div style={{background:"linear-gradient(90deg,#22c55e,#06b6d4)",width:`${myPools.length?(doneMy.length/myPools.length)*100:0}%`,height:"100%",borderRadius:99,transition:"width .6s"}}/></div>
        </Card>
        <button onClick={()=>optimize(myPools)} disabled={optimizing} style={{width:"100%",background:optimizing?"#0d1626":"linear-gradient(135deg,#1f2937,#111827)",border:"1px solid rgba(59,130,246,0.2)",borderRadius:12,padding:"11px",fontSize:13,fontWeight:700,color:optimizing?"#6b7280":"#60a5fa",cursor:"pointer",marginBottom:14}}>
          {optimizing?"⚙️ Optimizing...":"⚡ Optimize My Route"}
        </button>
        {next&&(
          <>
            <div style={{fontSize:11,fontWeight:700,color:"#6b7280",marginBottom:8,letterSpacing:1}}>NEXT STOP</div>
            <div style={{background:"linear-gradient(135deg,#0d1f3c,#0a1628)",borderRadius:16,padding:"16px",marginBottom:14,border:"1px solid rgba(59,130,246,0.25)"}}>
              <div style={{fontWeight:700,fontSize:16,marginBottom:4}}>{next.customer}</div>
              <button onClick={()=>openMaps(next.address)} style={{fontSize:13,color:"#60a5fa",background:"none",border:"none",cursor:"pointer",padding:0,textDecoration:"underline",marginBottom:8,display:"block"}}>📍 {next.address.split(",")[0]}</button>
              {next.filterVisits>=filterEvery&&<div style={{fontSize:12,color:"#ef4444",background:"rgba(239,68,68,0.08)",borderRadius:8,padding:"6px 10px",marginBottom:10}}>🔵 Filter clean due this visit</div>}
              <div style={{display:"flex",gap:8}}>
                <button onClick={()=>doSend(next,"onmyway")} disabled={!!sending[`${next.id}_onmyway`]} style={{flex:1,background:sending[`${next.id}_onmyway`]?"#1f2937":"linear-gradient(135deg,#f5a623,#e07b00)",border:"none",borderRadius:10,padding:"11px",fontSize:13,fontWeight:700,color:sending[`${next.id}_onmyway`]?"#6b7280":"#fff",cursor:"pointer"}}>{sending[`${next.id}_onmyway`]?"⏳":"🚗 On My Way"}</button>
                <button onClick={()=>setVisitPool(next)} style={{flex:1,background:"linear-gradient(135deg,#22c55e,#16a34a)",border:"none",borderRadius:10,padding:"11px",fontSize:13,fontWeight:700,color:"#fff",cursor:"pointer"}}>▶ Start Visit</button>
              </div>
            </div>
          </>
        )}
        <div style={{fontSize:11,fontWeight:700,color:"#6b7280",marginBottom:8,letterSpacing:1}}>ALL MY STOPS</div>
        {myPools.map(p=>(
          <div key={p.id} onClick={()=>setSelPool(p)} style={{background:"#0d1626",borderRadius:13,padding:"12px 14px",marginBottom:8,border:"1px solid rgba(255,255,255,0.04)",cursor:"pointer",display:"flex",gap:10,alignItems:"center"}}>
            <div style={{width:26,height:26,borderRadius:50,background:p.status==="Completed"?"#22c55e":"#1f2937",display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:700,color:p.status==="Completed"?"#fff":"#6b7280",flexShrink:0}}>{p.status==="Completed"?"✓":p.order}</div>
            <div style={{flex:1}}><div style={{fontWeight:600,fontSize:14}}>{p.customer}</div><div style={{fontSize:11,color:"#6b7280"}}>{p.address.split(",")[0]}</div></div>
            <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:3}}><Badge status={p.status}/>{p.filterVisits>=filterEvery&&<span style={{fontSize:9,color:"#ef4444"}}>🔵 filter due</span>}</div>
          </div>
        ))}
      </div>
    ),
    route:(
      <>
        <div style={{padding:"14px 16px 0",display:"flex",justifyContent:"flex-end"}}>
          <button onClick={()=>optimize(myPools)} disabled={optimizing} style={{background:optimizing?"#1f2937":"linear-gradient(135deg,#22c55e,#16a34a)",border:"none",borderRadius:10,padding:"8px 14px",fontSize:12,fontWeight:700,color:optimizing?"#6b7280":"#fff",cursor:"pointer"}}>{optimizing?"⚙️...":"⚡ Optimize"}</button>
        </div>
        <RouteList pools={myPools} onReorder={re=>upPools([...pools.filter(p=>!re.find(r=>r.id===p.id)),...re])} onSelect={setSelPool} techFilter={user.id} setTechFilter={()=>{}} users={users} showFilter={false}/>
      </>
    ),
    customers:(
      <div style={{padding:"16px"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
          <div><div style={{fontSize:18,fontWeight:700}}>Customers</div><div style={{fontSize:13,color:"#4b5563"}}>Add or view accounts</div></div>
          <button onClick={()=>setAddCustomer(true)} style={{background:"linear-gradient(135deg,#3b82f6,#06b6d4)",border:"none",borderRadius:12,padding:"10px 16px",fontSize:13,fontWeight:700,color:"#fff",cursor:"pointer"}}>+ Add</button>
        </div>
        {pools.map(p=>(
          <div key={p.id} onClick={()=>setSelPool(p)} style={{background:"#0d1626",borderRadius:13,padding:"13px 14px",marginBottom:8,border:"1px solid rgba(255,255,255,0.04)",cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div><div style={{fontWeight:600,fontSize:14}}>{p.customer}</div><div style={{fontSize:11,color:"#6b7280"}}>{p.address.split(",")[0]} · {p.type}</div></div>
            <Badge status={p.status}/>
          </div>
        ))}
      </div>
    ),
    done:(
      <div style={{padding:"16px"}}>
        <div style={{fontSize:18,fontWeight:700,marginBottom:4}}>Completed Today</div>
        <div style={{fontSize:13,color:"#4b5563",marginBottom:14}}>{doneMy.length} stops done</div>
        {doneMy.length===0&&<Card><div style={{textAlign:"center",color:"#374151",fontSize:14,padding:"20px 0"}}>No completed stops yet</div></Card>}
        {doneMy.map(p=>(
          <div key={p.id} onClick={()=>setSelPool(p)} style={{background:"#0d1626",borderRadius:13,padding:"14px",marginBottom:8,border:"1px solid rgba(34,197,94,0.1)",cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
            <div>
              <div style={{fontWeight:600,fontSize:14}}>{p.customer}</div>
              <div style={{fontSize:12,color:"#6b7280"}}>{p.address.split(",")[0]}</div>
              <div style={{fontSize:12,color:"#22c55e",marginTop:4}}>✓ {p.lastService}{p.lastDuration?` · ${fmtTime(p.lastDuration)}`:""}</div>
              {(p.photos?.length>0||p.afterPhotos?.length>0)&&<div style={{fontSize:11,color:"#6b7280"}}>📷 {p.photos?.length||0} before · {p.afterPhotos?.length||0} after</div>}
            </div>
            <Badge status={p.status}/>
          </div>
        ))}
      </div>
    ),
  };

  return <AppShell subtitle="Technician" nav={<TopNav tabs={techTabs} active={techTab} onChange={setTechTab}/>} content={techContent[techTab]}/>;
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(DesertBloom));
  </script>
</body>
</html>
