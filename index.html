                          <span style={{fontSize:11,color:"#6b7280"}}>{v.tech}{v.duration?" · "+fmtTime(v.duration):""}</span>
                        </div>
                        {v.readings&&Object.entries(v.readings).filter(([,val])=>val!=null).length>0&&(
                          <div style={{fontSize:11,color:"#9ca3af",marginBottom:v.chemicals?.length?6:0}}>
                            {[v.readings.ph!=null?"pH "+v.readings.ph:null,v.readings.chlorine!=null?"Cl "+v.readings.chlorine+" ppm":null,v.readings.alkalinity!=null?"Alk "+v.readings.alkalinity:null,v.readings.calcium!=null?"Ca "+v.readings.calcium:null].filter(Boolean).join(" · ")}
                          </div>
                        )}
                        {v.chemicals&&v.chemicals.length>0&&(
                          <div style={{display:"flex",flexWrap:"wrap",gap:4}}>
                            {v.chemicals.map((c,j)=><span key={j} style={{fontSize:10,background:"rgba(59,130,246,0.1)",color:"#60a5fa",borderRadius:6,padding:"2px 7px"}}>{c.amount} {c.unit} {c.chemical}</span>)}
                            {v.chlorineTabs&&<span style={{fontSize:10,background:"rgba(59,130,246,0.1)",color:"#60a5fa",borderRadius:6,padding:"2px 7px"}}>{v.chlorineTabs} tab{v.chlorineTabs==="1"?"":"s"}</span>}
                          </div>
                        )}
                        {(!v.chemicals||!v.chemicals.length)&&!v.chlorineTabs&&<div style={{fontSize:11,color:"#374151",fontStyle:"italic"}}>No chemicals logged</div>}
                      </div>
                    );
                  })}
                </div>
              ))}
            </Card>
          );
        })()}
        <button onClick={onSendOnMyWay} disabled={sending} style={{width:"100%",background:sending?"#1f2937":"linear-gradient(135deg,#f5a623,#e07b00)",border:"none",borderRadius:13,padding:"13px",fontSize:14,fontWeight:700,color:sending?"#6b7280":"#fff",cursor:"pointer",marginBottom:10}}>{sending?"⏳ Sending...":"🚗 Send On My Way Text"}</button>
        <button onClick={onStartVisit} style={{width:"100%",background:pool.status==="Completed"?"rgba(34,197,94,0.1)":"linear-gradient(135deg,#3b82f6,#06b6d4)",border:pool.status==="Completed"?"1px solid rgba(34,197,94,0.3)":"none",borderRadius:13,padding:"14px",fontSize:15,fontWeight:700,color:pool.status==="Completed"?"#22c55e":"#fff",cursor:"pointer"}}>{pool.status==="Completed"?"✓ Completed — Start New Visit":"▶ Start Service Visit"}</button>
      </div>
    </div>
  );
}

function CustomerForm({existing,users,onSave,onBack}){
  const techs=users.filter(u=>u.role==="tech");
  const blank={customer:"",phone:"",address:"",type:"Residential",size:"",tech:techs[0]?.id||"",notes:"",equipment:"",salt:false,monthlyRate:"",serviceDay:"Monday"};
  const [f,setF]=useState(existing?{...existing,equipment:(existing.equipment||[]).join(", "),salt:!!existing.salt,monthlyRate:existing.monthlyRate||""}:blank);
  const [err,setErr]=useState({});
  const [done,setDone]=useState(false);
  const s=(k,v)=>setF(x=>({...x,[k]:v}));
  const save=()=>{
    const e={};
    if(!f.customer.trim()) e.customer="Required";
    if(!f.address.trim()) e.address="Required";
    if(!f.phone.trim()) e.phone="Required";
    setErr(e);if(Object.keys(e).length) return;
    const pool={id:existing?.id||Date.now(),customer:f.customer.trim(),phone:f.phone.trim().startsWith("+")?f.phone.trim():"+1"+f.phone.trim().replace(/\D/g,""),address:f.address.trim(),lat:33.5,lng:-111.9,type:f.type,size:f.size||"Unknown",status:existing?.status||"Scheduled",lastService:existing?.lastService||"Never",tech:f.tech,ph:existing?.ph||7.4,chlorine:existing?.chlorine||2.0,alkalinity:existing?.alkalinity||100,calcium:existing?.calcium||250,salt:f.salt?(existing?.salt||3200):null,notes:f.notes.trim(),equipment:f.equipment.split(",").map(e=>e.trim()).filter(Boolean),photos:existing?.photos||[],afterPhotos:existing?.afterPhotos||[],order:existing?.order||999,visits:existing?.visits||0,filterVisits:existing?.filterVisits||0,monthlyRate:parseFloat(f.monthlyRate)||0,serviceDay:f.serviceDay,scheduledTime:existing?.scheduledTime??420,serviceHistory:existing?.serviceHistory||[]};
    onSave(pool);setDone(true);setTimeout(()=>{setDone(false);onBack();},1500);
  };
  return(
    <div style={{fontFamily:"sans-serif",background:"#060d1a",minHeight:"100vh",color:"#e2e8f0",paddingBottom:40}}>
      <PageHeader onBack={onBack} title={existing?"Edit Customer":"Add New Customer"}/>
      <div style={{padding:"16px"}}>
        {done&&<div style={{background:"rgba(34,197,94,0.1)",border:"1px solid rgba(34,197,94,0.3)",borderRadius:12,padding:"14px",textAlign:"center",color:"#22c55e",fontWeight:700,marginBottom:16}}>✓ {existing?"Saved!":"Customer added!"}</div>}
        <Card style={{marginBottom:14}}>
          <div style={{fontSize:13,fontWeight:700,marginBottom:12}}>👤 Customer Info</div>
          <Inp label="FULL NAME" value={f.customer} onChange={v=>s("customer",v)} placeholder="John Smith" error={err.customer}/>
          <Inp label="PHONE" value={f.phone} onChange={v=>s("phone",v)} placeholder="(480) 555-1234" type="tel" error={err.phone}/>
          <Inp label="ADDRESS" value={f.address} onChange={v=>s("address",v)} placeholder="123 Main St, Scottsdale, AZ" error={err.address}/>
          <div style={{marginBottom:12}}><div style={{fontSize:11,color:"#6b7280",marginBottom:4,letterSpacing:1}}>NOTES / GATE CODE</div><textarea value={f.notes} onChange={e=>s("notes",e.target.value)} placeholder="Gate code, dogs, special instructions..." style={{width:"100%",background:"#111827",border:"1px solid rgba(255,255,255,0.08)",borderRadius:9,padding:"10px 13px",fontSize:13,color:"#e2e8f0",outline:"none",resize:"none",height:70,boxSizing:"border-box"}}/></div>
        </Card>
        <Card style={{marginBottom:14}}>
          <div style={{fontSize:13,fontWeight:700,marginBottom:12}}>🏊 Pool & Service Info</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
            <Sel label="TYPE" value={f.type} onChange={v=>s("type",v)}><option>Residential</option><option>Commercial</option></Sel>
            <Inp label="SIZE" value={f.size} onChange={v=>s("size",v)} placeholder="15,000 gal"/>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
            <Inp label="MONTHLY RATE ($)" value={f.monthlyRate} onChange={v=>s("monthlyRate",v)} placeholder="149" type="number"/>
            <Sel label="SERVICE DAY" value={f.serviceDay} onChange={v=>s("serviceDay",v)}>{["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"].map(d=><option key={d}>{d}</option>)}</Sel>
          </div>
          <Sel label="ASSIGN TO TECH" value={f.tech} onChange={v=>s("tech",v)}>{techs.map(t=><option key={t.id} value={t.id}>{t.name}</option>)}</Sel>
          <Inp label="EQUIPMENT (comma separated)" value={f.equipment} onChange={v=>s("equipment",v)} placeholder="Hayward Pump, Pentair Filter"/>
          <div onClick={()=>s("salt",!f.salt)} style={{display:"flex",alignItems:"center",gap:10,cursor:"pointer",padding:"6px 0"}}>
            <div style={{width:24,height:24,borderRadius:6,background:f.salt?"#3b82f6":"#111827",border:`2px solid ${f.salt?"#3b82f6":"rgba(255,255,255,0.1)"}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,color:"#fff"}}>{f.salt?"✓":""}</div>
            <span style={{fontSize:14}}>Salt Water Pool (SWG)</span>
          </div>
        </Card>
        <button onClick={save} style={{width:"100%",background:"linear-gradient(135deg,#3b82f6,#06b6d4)",border:"none",borderRadius:14,padding:"15px",fontSize:15,fontWeight:700,color:"#fff",cursor:"pointer"}}>{existing?"Save Changes":"➕ Add Customer"}</button>
      </div>
    </div>
  );
}

function UserManager({users,onSave,onBack}){
  const [list,setList]=useState(users);
  const [editing,setEditing]=useState(null);
  const [form,setForm]=useState({name:"",role:"tech",password:"",phone:""});
  const [saved,setSaved]=useState(false);
  const saveUser=()=>{
    if(!form.name.trim()||!form.password.trim()) return;
    const u=editing?{...editing,...form,name:form.name.trim()}:{id:Date.now().toString(),name:form.name.trim(),role:form.role,password:form.password,phone:form.phone};
    const updated=editing?list.map(x=>x.id===editing.id?u:x):[...list,u];
    setList(updated);onSave(updated);setEditing(null);setForm({name:"",role:"tech",password:"",phone:""});setSaved(true);setTimeout(()=>setSaved(false),2000);
  };
  return(
    <div style={{fontFamily:"sans-serif",background:"#060d1a",minHeight:"100vh",color:"#e2e8f0",paddingBottom:40}}>
      <PageHeader onBack={onBack} title="👥 User Management"/>
      <div style={{padding:"16px"}}>
        {saved&&<div style={{background:"rgba(34,197,94,0.1)",border:"1px solid rgba(34,197,94,0.3)",borderRadius:10,padding:"10px 14px",color:"#22c55e",fontWeight:600,fontSize:13,marginBottom:14}}>✓ Saved!</div>}
        <Card style={{marginBottom:16}}>
          <div style={{fontSize:13,fontWeight:700,marginBottom:12}}>{editing?"✏️ Edit User":"➕ Add New User"}</div>
          <Inp label="NAME" value={form.name} onChange={v=>setForm(f=>({...f,name:v}))} placeholder="Full name"/>
          <Sel label="ROLE" value={form.role} onChange={v=>setForm(f=>({...f,role:v}))}><option value="tech">Technician</option><option value="owner">Owner</option></Sel>
          <Inp label="PASSWORD" value={form.password} onChange={v=>setForm(f=>({...f,password:v}))} placeholder="Password" type="password"/>
          <Inp label="PHONE" value={form.phone} onChange={v=>setForm(f=>({...f,phone:v}))} placeholder="(480) 555-1234" type="tel"/>
          <div style={{display:"flex",gap:8}}>
            {editing&&<button onClick={()=>{setEditing(null);setForm({name:"",role:"tech",password:"",phone:""});}} style={{flex:1,background:"#111827",border:"1px solid rgba(255,255,255,0.08)",borderRadius:10,padding:"11px",fontSize:13,color:"#9ca3af",cursor:"pointer"}}>Cancel</button>}
            <button onClick={saveUser} style={{flex:2,background:"linear-gradient(135deg,#3b82f6,#06b6d4)",border:"none",borderRadius:10,padding:"11px",fontSize:14,fontWeight:700,color:"#fff",cursor:"pointer"}}>{editing?"Save Changes":"Add User"}</button>
          </div>
        </Card>
        <div style={{fontSize:12,fontWeight:700,color:"#6b7280",marginBottom:8,letterSpacing:1}}>CURRENT USERS ({list.length})</div>
        {list.map(u=>(
          <div key={u.id} style={{background:"#0d1626",borderRadius:13,padding:"13px 14px",marginBottom:8,border:"1px solid rgba(255,255,255,0.05)",display:"flex",alignItems:"center",gap:12}}>
            <div style={{width:40,height:40,borderRadius:50,background:u.role==="owner"?"linear-gradient(135deg,#f97316,#ec4899)":"linear-gradient(135deg,#3b82f6,#8b5cf6)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,fontWeight:800,color:"#fff",flexShrink:0}}>{u.name.split(" ").map(n=>n[0]).join("").slice(0,2)}</div>
            <div style={{flex:1}}><div style={{fontWeight:600,fontSize:14}}>{u.name}</div><div style={{fontSize:11,color:"#6b7280"}}>{u.role==="owner"?"Owner":"Technician"} · {u.phone||"No phone"}</div></div>
            <div style={{display:"flex",gap:6}}>
              <button onClick={()=>{setEditing(u);setForm({name:u.name,role:u.role,password:u.password,phone:u.phone||""});}} style={{background:"rgba(59,130,246,0.1)",border:"1px solid rgba(59,130,246,0.2)",borderRadius:8,padding:"5px 10px",fontSize:12,color:"#60a5fa",cursor:"pointer"}}>Edit</button>
              {u.id!=="owner"&&<button onClick={()=>{const u2=list.filter(x=>x.id!==u.id);setList(u2);onSave(u2);}} style={{background:"rgba(239,68,68,0.1)",border:"1px solid rgba(239,68,68,0.2)",borderRadius:8,padding:"5px 10px",fontSize:12,color:"#ef4444",cursor:"pointer"}}>Remove</button>}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function RouteList({pools,onReorder,onSelect,onTimeChange,techFilter,setTechFilter,users,showFilter=true}){
  const ALL_DAYS=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
  const dStr=(d)=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  const fmtMins=(mins)=>{if(mins==null)return"7:00 AM";const h=Math.floor(mins/60)%12||12;const m=mins%60;const ampm=Math.floor(mins/60)<12?"AM":"PM";return`${h}:${m.toString().padStart(2,"0")} ${ampm}`;};
  const todayD=new Date();todayD.setHours(0,0,0,0);
  const todayS=dStr(todayD);
  const [viewDate,setViewDate]=useState(()=>{const d=new Date();d.setHours(0,0,0,0);return d;});
  const [viewMonth,setViewMonth]=useState(()=>new Date(new Date().getFullYear(),new Date().getMonth(),1));
  const [dragging,setDragging]=useState(null);
  const [over,setOver]=useState(null);
  const techs=users.filter(u=>u.role==="tech");
  const poolsForDay=(dn)=>[...pools].filter(p=>p.serviceDay===dn&&(techFilter==="all"||p.tech===techFilter)).sort((a,b)=>(a.scheduledTime??420)-(b.scheduledTime??420));
  const getStatus=(pool,d)=>{
    const h=(pool.serviceHistory||[]).find(x=>x.date===dStr(d));
    if(h)return"completed";
    const dd=new Date(d);dd.setHours(0,0,0,0);
    if(dd.getTime()<todayD.getTime())return"overdue";
    if(dd.getTime()===todayD.getTime())return"due";
    return"scheduled";
  };
  const SC={completed:"#22c55e",overdue:"#ef4444",due:"#3b82f6",scheduled:"rgba(255,255,255,0.08)"};
  const cellStatus=(d)=>{
    if(d.getDay()===0)return null;
    const dp=poolsForDay(ALL_DAYS[d.getDay()]);
    if(!dp.length)return null;
    const ss=dp.map(p=>getStatus(p,d));
    if(ss.every(s=>s==="completed"))return"completed";
    if(ss.some(s=>s==="overdue"))return"overdue";
    if(ss.some(s=>s==="due"))return"due";
    return"scheduled";
  };
  const yr=viewMonth.getFullYear(),mo=viewMonth.getMonth();
  const firstDow=new Date(yr,mo,1).getDay();
  const daysInMonth=new Date(yr,mo+1,0).getDate();
  const cells=[];
  for(let i=0;i<firstDow;i++)cells.push(null);
  for(let d=1;d<=daysInMonth;d++)cells.push(new Date(yr,mo,d));
  const selDayName=ALL_DAYS[viewDate.getDay()];
  const dayPools=poolsForDay(selDayName);
  const drop=(e,tid)=>{e.preventDefault();if(dragging===tid){setDragging(null);setOver(null);return;}const fi=dayPools.findIndex(p=>p.id===dragging);const ti=dayPools.findIndex(p=>p.id===tid);if(fi<0||ti<0){setDragging(null);setOver(null);return;}const re=[...dayPools];const[mv]=re.splice(fi,1);re.splice(ti,0,mv);onReorder(re.map((p,i)=>({...p,order:i+1})));setDragging(null);setOver(null);};
  return(
    <div style={{padding:"14px 16px"}}>
      {showFilter&&(<div style={{display:"flex",gap:6,marginBottom:12,flexWrap:"wrap"}}>
        <button onClick={()=>setTechFilter("all")} style={{background:techFilter==="all"?"#3b82f6":"#0d1626",color:techFilter==="all"?"#fff":"#9ca3af",border:`1px solid ${techFilter==="all"?"#3b82f6":"rgba(255,255,255,0.07)"}`,borderRadius:20,padding:"5px 14px",fontSize:12,fontWeight:600,cursor:"pointer"}}>All</button>
        {techs.map(t=><button key={t.id} onClick={()=>setTechFilter(t.id)} style={{background:techFilter===t.id?"#3b82f6":"#0d1626",color:techFilter===t.id?"#fff":"#9ca3af",border:`1px solid ${techFilter===t.id?"#3b82f6":"rgba(255,255,255,0.07)"}`,borderRadius:20,padding:"5px 14px",fontSize:12,fontWeight:600,cursor:"pointer"}}>{t.name.split(" ")[0]}</button>)}
      </div>)}
      <div style={{background:"#0d1626",borderRadius:16,padding:"14px 10px",marginBottom:14,border:"1px solid rgba(255,255,255,0.06)"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}}>
          <button onClick={()=>setViewMonth(m=>new Date(m.getFullYear(),m.getMonth()-1,1))} style={{background:"#1f2937",border:"1px solid rgba(255,255,255,0.1)",borderRadius:9,width:32,height:32,fontSize:17,color:"#9ca3af",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>‹</button>
          <div style={{textAlign:"center"}}>
            <div style={{fontSize:15,fontWeight:700,color:"#f1f5f9"}}>{MONTHS[mo]} {yr}</div>
            <div style={{display:"flex",gap:10,marginTop:4,fontSize:10,color:"#374151",justifyContent:"center"}}>
              <span style={{color:"#22c55e"}}>● Done</span>
              <span style={{color:"#ef4444"}}>● Overdue</span>
              <span style={{color:"#3b82f6"}}>● Due</span>
              <span style={{color:"#4b5563"}}>● Sched</span>
            </div>
          </div>
          <button onClick={()=>setViewMonth(m=>new Date(m.getFullYear(),m.getMonth()+1,1))} style={{background:"#1f2937",border:"1px solid rgba(255,255,255,0.1)",borderRadius:9,width:32,height:32,fontSize:17,color:"#9ca3af",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>›</button>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:1,marginBottom:4}}>
          {["Su","Mo","Tu","We","Th","Fr","Sa"].map(d=><div key={d} style={{textAlign:"center",fontSize:10,fontWeight:700,color:"#374151",padding:"2px 0"}}>{d}</div>)}
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:2}}>
          {cells.map((d,i)=>{
            if(!d)return<div key={`p${i}`}/>;
            const sel=dStr(d)===dStr(viewDate);
            const tod=dStr(d)===todayS;
            const st=cellStatus(d);
            const sc=SC[st]||"transparent";
            return(
              <button key={dStr(d)} onClick={()=>setViewDate(new Date(d))} style={{background:sel?sc||"#1f2937":"transparent",border:`${tod&&!sel?"2px":"1px"} solid ${tod&&!sel?"#60a5fa":"transparent"}`,borderRadius:7,padding:"5px 1px",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:2,outline:"none"}}>
                <span style={{fontSize:11,fontWeight:sel||tod?700:400,color:sel?"#fff":tod?"#60a5fa":st?"#cbd5e0":"#374151"}}>{d.getDate()}</span>
                {st&&<div style={{width:4,height:4,borderRadius:2,background:sel?"rgba(255,255,255,0.8)":sc}}/>}
              </button>
            );
          })}
        </div>
      </div>
      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12,paddingBottom:10,borderBottom:`1px solid ${dStr(viewDate)===todayS?"rgba(34,197,94,0.3)":"rgba(255,255,255,0.06)"}`}}>
        <span style={{fontSize:14,fontWeight:700,color:dStr(viewDate)===todayS?"#22c55e":"#f1f5f9"}}>{selDayName}, {viewDate.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"})}</span>
        {dStr(viewDate)===todayS&&<span style={{fontSize:10,fontWeight:700,color:"#22c55e",background:"rgba(34,197,94,0.15)",border:"1px solid rgba(34,197,94,0.3)",borderRadius:10,padding:"2px 8px"}}>TODAY</span>}
        <span style={{fontSize:11,color:"#6b7280",marginLeft:"auto"}}>{dayPools.length} stop{dayPools.length!==1?"s":""}</span>
      </div>
      {dayPools.length===0?(
        <div style={{textAlign:"center",padding:"28px 16px"}}>
          <div style={{fontSize:28,marginBottom:8}}>🌵</div>
          <div style={{fontSize:13,fontWeight:600,color:"#6b7280",marginBottom:3}}>{selDayName==="Sunday"?"Sundays are off":"No stops on "+selDayName+"s"}</div>
          <div style={{fontSize:12,color:"#4b5563"}}>Tap a date on the calendar above</div>
        </div>
      ):(
        <div>
          <div style={{fontSize:11,color:"#6b7280",marginBottom:10}}>Drag ⠿ to reorder · tap −/+ to adjust time</div>
          {dayPools.map((pool,i)=>{
            const st=getStatus(pool,viewDate);
            const hist=(pool.serviceHistory||[]).find(h=>h.date===dStr(viewDate));
            return(
              <div key={pool.id} draggable onDragStart={e=>{setDragging(pool.id);e.dataTransfer.effectAllowed="move";}} onDragOver={e=>{e.preventDefault();setOver(pool.id);}} onDrop={e=>drop(e,pool.id)} onDragEnd={()=>{setDragging(null);setOver(null);}} style={{background:over===pool.id?"rgba(59,130,246,0.1)":"#0d1626",borderRadius:13,padding:"12px 14px",marginBottom:8,border:`2px solid ${st==="completed"?"rgba(34,197,94,0.25)":dragging===pool.id?"#3b82f6":over===pool.id?"rgba(59,130,246,0.4)":"rgba(255,255,255,0.04)"}`,opacity:dragging===pool.id?0.4:1,userSelect:"none"}}>
                <div style={{display:"flex",gap:10,alignItems:"flex-start"}}>
                  <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:3,paddingTop:2,cursor:"grab"}}>
                    <span style={{fontSize:14,color:"#374151"}}>⠿</span>
                    <div style={{width:24,height:24,borderRadius:50,background:st==="completed"?"#22c55e":st==="overdue"?"rgba(239,68,68,0.8)":st==="due"?"#3b82f6":"#1f2937",display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,fontWeight:700,color:"#fff"}}>{st==="completed"?"✓":st==="overdue"?"!":i+1}</div>
                  </div>
                  <div style={{flex:1}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:5}}>
                      <div style={{fontWeight:600,fontSize:14}}>{pool.customer}</div>
                      <span style={{fontSize:10,fontWeight:700,padding:"3px 8px",borderRadius:20,background:st==="completed"?"rgba(34,197,94,0.12)":st==="overdue"?"rgba(239,68,68,0.12)":st==="due"?"rgba(59,130,246,0.12)":"rgba(255,255,255,0.05)",color:st==="completed"?"#22c55e":st==="overdue"?"#f87171":st==="due"?"#60a5fa":"#6b7280"}}>{st==="completed"?"✅ Done":st==="overdue"?"⚠️ Overdue":st==="due"?"📋 Due Today":"🗓 Scheduled"}</span>
                    </div>
                    {st==="completed"&&hist&&<div style={{fontSize:11,color:"#4ade80",marginBottom:5}}>Serviced by {hist.tech}{hist.duration?" · "+fmtTime(hist.duration):""}</div>}
                    {st!=="completed"&&(
                      <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:7}}>
                        <button onClick={e=>{e.stopPropagation();onTimeChange&&onTimeChange(pool.id,Math.max(360,(pool.scheduledTime??420)-30));}} style={{background:"#1f2937",border:"1px solid rgba(255,255,255,0.1)",borderRadius:6,padding:"4px 10px",fontSize:11,color:"#9ca3af",cursor:"pointer",fontWeight:600}}>−30m</button>
                        <span style={{fontSize:12,fontWeight:700,color:"#e2e8f0",background:"#111827",borderRadius:8,padding:"4px 12px",minWidth:74,textAlign:"center"}}>{fmtMins(pool.scheduledTime??420)}</span>
                        <button onClick={e=>{e.stopPropagation();onTimeChange&&onTimeChange(pool.id,Math.min(1380,(pool.scheduledTime??420)+30));}} style={{background:"#1f2937",border:"1px solid rgba(255,255,255,0.1)",borderRadius:6,padding:"4px 10px",fontSize:11,color:"#9ca3af",cursor:"pointer",fontWeight:600}}>+30m</button>
                      </div>
                    )}
                    <button onClick={e=>{e.stopPropagation();openMaps(pool.address);}} style={{fontSize:12,color:"#60a5fa",background:"none",border:"none",cursor:"pointer",padding:0,textDecoration:"underline",textAlign:"left",marginBottom:5}}>📍 {pool.address.split(",")[0]}</button>
                    <div style={{display:"flex",gap:6,flexWrap:"wrap",marginTop:2}}>
                      <span style={{fontSize:11,background:"#111827",color:"#9ca3af",borderRadius:6,padding:"2px 7px"}}>{users.find(u=>u.id===pool.tech)?.name||pool.tech}</span>
                      {pool.monthlyRate&&<span style={{fontSize:11,background:"rgba(34,197,94,0.1)",color:"#22c55e",borderRadius:6,padding:"2px 7px"}}>{fmtMoney(pool.monthlyRate)}/mo</span>}
                      <button onClick={e=>{e.stopPropagation();onSelect(pool);}} style={{fontSize:11,background:"rgba(59,130,246,0.1)",border:"1px solid rgba(59,130,246,0.2)",color:"#60a5fa",borderRadius:6,padding:"2px 8px",cursor:"pointer"}}>Details</button>
                    </div>
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function ProfitTracker({pools,invoices,setInvoices,users}){
  const [showAdd,setShowAdd]=useState(false);
  const [form,setForm]=useState({customer:"",amount:"",serviceDate:todayStr(),status:"Pending",notes:""});
  const [filter,setFilter]=useState("all");
  const totalRevenue=invoices.filter(i=>i.status==="Paid").reduce((s,i)=>s+Number(i.amount||0),0);
  const totalPending=invoices.filter(i=>i.status==="Pending").reduce((s,i)=>s+Number(i.amount||0),0);
  const totalOverdue=invoices.filter(i=>i.status==="Overdue").reduce((s,i)=>s+Number(i.amount||0),0);
  const monthlyRecurring=pools.reduce((s,p)=>s+Number(p.monthlyRate||0),0);
  const markPaid=(id)=>setInvoices(inv=>inv.map(i=>i.id===id?{...i,status:"Paid",paidDate:todayStr()}:i));
  const markOverdue=(id)=>setInvoices(inv=>inv.map(i=>i.id===id?{...i,status:"Overdue"}:i));
  const addInvoice=()=>{
    if(!form.customer||!form.amount) return;
    const inv={id:Date.now(),customer:form.customer,amount:parseFloat(form.amount),serviceDate:form.serviceDate,status:form.status,paidDate:"",notes:form.notes};
    setInvoices(i=>[...i,inv]);setForm({customer:"",amount:"",serviceDate:todayStr(),status:"Pending",notes:""});setShowAdd(false);
  };
  const filtered=filter==="all"?invoices:invoices.filter(i=>i.status===filter);
  return(
    <div style={{padding:"16px"}}>
      <div style={{fontSize:18,fontWeight:700,marginBottom:14}}>💰 Profit Tracker</div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:14}}>
        <div style={{background:"linear-gradient(135deg,rgba(34,197,94,0.15),rgba(34,197,94,0.05))",borderRadius:14,padding:"14px",border:"1px solid rgba(34,197,94,0.25)"}}><div style={{fontSize:11,color:"#6b7280",marginBottom:4}}>COLLECTED</div><div style={{fontSize:24,fontWeight:800,color:"#22c55e"}}>{fmtMoney(totalRevenue)}</div><div style={{fontSize:11,color:"#6b7280",marginTop:2}}>{invoices.filter(i=>i.status==="Paid").length} invoices paid</div></div>
        <div style={{background:"linear-gradient(135deg,rgba(245,166,35,0.15),rgba(245,166,35,0.05))",borderRadius:14,padding:"14px",border:"1px solid rgba(245,166,35,0.25)"}}><div style={{fontSize:11,color:"#6b7280",marginBottom:4}}>PENDING</div><div style={{fontSize:24,fontWeight:800,color:"#f5a623"}}>{fmtMoney(totalPending)}</div><div style={{fontSize:11,color:"#6b7280",marginTop:2}}>{invoices.filter(i=>i.status==="Pending").length} awaiting payment</div></div>
        <div style={{background:"linear-gradient(135deg,rgba(239,68,68,0.15),rgba(239,68,68,0.05))",borderRadius:14,padding:"14px",border:"1px solid rgba(239,68,68,0.25)"}}><div style={{fontSize:11,color:"#6b7280",marginBottom:4}}>OVERDUE</div><div style={{fontSize:24,fontWeight:800,color:"#ef4444"}}>{fmtMoney(totalOverdue)}</div><div style={{fontSize:11,color:"#6b7280",marginTop:2}}>{invoices.filter(i=>i.status==="Overdue").length} overdue</div></div>
        <div style={{background:"linear-gradient(135deg,rgba(59,130,246,0.15),rgba(59,130,246,0.05))",borderRadius:14,padding:"14px",border:"1px solid rgba(59,130,246,0.25)"}}><div style={{fontSize:11,color:"#6b7280",marginBottom:4}}>MONTHLY RECURRING</div><div style={{fontSize:24,fontWeight:800,color:"#60a5fa"}}>{fmtMoney(monthlyRecurring)}</div><div style={{fontSize:11,color:"#6b7280",marginTop:2}}>{pools.length} active accounts</div></div>
      </div>
      <Card style={{marginBottom:14}}>
        <div style={{fontSize:13,fontWeight:700,marginBottom:10}}>👷 Revenue by Tech</div>
        {users.filter(u=>u.role==="tech").map(t=>{
          const tp=pools.filter(p=>p.tech===t.id);
          const techRevenue=invoices.filter(i=>i.status==="Paid"&&tp.find(p=>p.customer===i.customer)).reduce((s,i)=>s+Number(i.amount||0),0);
          const techMonthly=tp.reduce((s,p)=>s+Number(p.monthlyRate||0),0);
          return(<div key={t.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 0",borderBottom:"1px solid rgba(255,255,255,0.04)"}}><div><div style={{fontWeight:600,fontSize:14}}>{t.name}</div><div style={{fontSize:11,color:"#6b7280"}}>{tp.length} pools · {fmtMoney(techMonthly)}/mo</div></div><div style={{textAlign:"right"}}><div style={{fontSize:15,fontWeight:700,color:"#22c55e"}}>{fmtMoney(techRevenue)}</div><div style={{fontSize:11,color:"#6b7280"}}>collected</div></div></div>);
        })}
      </Card>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
        <div style={{fontSize:13,fontWeight:700,color:"#cbd5e0"}}>Invoices</div>
        <button onClick={()=>setShowAdd(!showAdd)} style={{background:"linear-gradient(135deg,#3b82f6,#06b6d4)",border:"none",borderRadius:10,padding:"7px 14px",fontSize:12,fontWeight:700,color:"#fff",cursor:"pointer"}}>+ Add Invoice</button>
      </div>
      {showAdd&&(<Card style={{marginBottom:14}}>
        <Sel label="CUSTOMER" value={form.customer} onChange={v=>setForm(f=>({...f,customer:v}))}><option value="">Select customer</option>{pools.map(p=><option key={p.id} value={p.customer}>{p.customer}</option>)}</Sel>
        <Inp label="AMOUNT ($)" value={form.amount} onChange={v=>setForm(f=>({...f,amount:v}))} placeholder="149" type="number"/>
        <Inp label="SERVICE DATE" value={form.serviceDate} onChange={v=>setForm(f=>({...f,serviceDate:v}))} placeholder="Apr 27"/>
        <Sel label="STATUS" value={form.status} onChange={v=>setForm(f=>({...f,status:v}))}><option>Pending</option><option>Paid</option><option>Overdue</option></Sel>
        <Inp label="NOTES" value={form.notes} onChange={v=>setForm(f=>({...f,notes:v}))} placeholder="Optional notes"/>
        <div style={{display:"flex",gap:8}}>
          <button onClick={()=>setShowAdd(false)} style={{flex:1,background:"#111827",border:"1px solid rgba(255,255,255,0.08)",borderRadius:10,padding:"10px",fontSize:13,color:"#9ca3af",cursor:"pointer"}}>Cancel</button>
          <button onClick={addInvoice} style={{flex:2,background:"linear-gradient(135deg,#3b82f6,#06b6d4)",border:"none",borderRadius:10,padding:"10px",fontSize:14,fontWeight:700,color:"#fff",cursor:"pointer"}}>Add Invoice</button>
        </div>
      </Card>)}
      <div style={{display:"flex",gap:6,marginBottom:12}}>{["all","Paid","Pending","Overdue"].map(f=>(<button key={f} onClick={()=>setFilter(f)} style={{background:filter===f?"#3b82f6":"#0d1626",color:filter===f?"#fff":"#9ca3af",border:`1px solid ${filter===f?"#3b82f6":"rgba(255,255,255,0.07)"}`,borderRadius:20,padding:"5px 12px",fontSize:11,fontWeight:600,cursor:"pointer"}}>{f==="all"?"All":f}</button>))}</div>
      {filtered.length===0&&<div style={{background:"#0d1626",borderRadius:12,padding:"20px",textAlign:"center",color:"#374151",fontSize:13}}>No invoices</div>}
      {filtered.map(inv=>(
        <div key={inv.id} style={{background:"#0d1626",borderRadius:13,padding:"13px 14px",marginBottom:8,border:`1px solid ${inv.status==="Paid"?"rgba(34,197,94,0.15)":inv.status==="Overdue"?"rgba(239,68,68,0.2)":"rgba(255,255,255,0.06)"}`}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:6}}>
            <div><div style={{fontWeight:600,fontSize:14}}>{inv.customer}</div><div style={{fontSize:11,color:"#6b7280"}}>{inv.serviceDate}{inv.paidDate?` · Paid ${inv.paidDate}`:""}</div>{inv.notes&&<div style={{fontSize:11,color:"#9ca3af",marginTop:2}}>{inv.notes}</div>}</div>
            <div style={{textAlign:"right"}}><div style={{fontSize:18,fontWeight:800,color:inv.status==="Paid"?"#22c55e":inv.status==="Overdue"?"#ef4444":"#f5a623"}}>{fmtMoney(inv.amount)}</div><div style={{fontSize:10,fontWeight:700,color:inv.status==="Paid"?"#22c55e":inv.status==="Overdue"?"#ef4444":"#f5a623"}}>{inv.status}</div></div>
          </div>
          {inv.status!=="Paid"&&(<div style={{display:"flex",gap:6}}>
            <button onClick={()=>markPaid(inv.id)} style={{flex:1,background:"rgba(34,197,94,0.1)",border:"1px solid rgba(34,197,94,0.25)",borderRadius:8,padding:"7px",fontSize:12,fontWeight:600,color:"#22c55e",cursor:"pointer"}}>✓ Mark Paid</button>
            {inv.status!=="Overdue"&&<button onClick={()=>markOverdue(inv.id)} style={{flex:1,background:"rgba(239,68,68,0.08)",border:"1px solid rgba(239,68,68,0.2)",borderRadius:8,padding:"7px",fontSize:12,fontWeight:600,color:"#ef4444",cursor:"pointer"}}>Mark Overdue</button>}
          </div>)}
        </div>
      ))}
    </div>
  );
}

// ── MAIN APP ──────────────────────────────────────────────────────────────────
function DesertBloom(){
  const [loading,setLoading]=useState(true);
  const [syncStatus,setSyncStatus]=useState(null);
  const [users,setUsers]=useState(DEFAULT_USERS);
  const [pools,setPools]=useState(DEFAULT_POOLS);
  const [invoices,setInvoices]=useState(DEFAULT_INVOICES);
  const [filterEvery,setFilterEvery]=useState(FILTER_DEFAULT);
  const [twilio,setTwilio]=useState({sid:"",token:"",from:"+14805715896"});
  const [smsLog,setSmsLog]=useState([]);
  const [user,setUser]=useState(()=>lsGet("db_session",null));
  const [loginCreds,setLoginCreds]=useState({u:"",p:""});
  const [loginErr,setLoginErr]=useState("");
  const [ownerTab,setOwnerTab]=useState("overview");
  const [techTab,setTechTab]=useState("day");
  const [selPool,setSelPool]=useState(null);
  const [visitPool,setVisitPool]=useState(null);
  const [addCustomer,setAddCustomer]=useState(null);
  const [showUsers,setShowUsers]=useState(false);
  const [routeFilter,setRouteFilter]=useState("all");
  const [optimizing,setOptimizing]=useState(false);
  const [sending,setSending]=useState({});
  const [remindersSent,setRemindersSent]=useState({});
  const [twilioSaved,setTwilioSaved]=useState(false);
  const [filterSaved,setFilterSaved]=useState(false);
  const [twilioTest,setTwilioTest]=useState(null);
  const [twilioTesting,setTwilioTesting]=useState(false);
  const [showToken,setShowToken]=useState(false);

  useEffect(()=>{
    DB.getAll().then(data=>{
      if(data){
        if(data.config){const tw=data.config.find(r=>r.Key==="twilio");if(tw)try{setTwilio(JSON.parse(tw.Value));}catch{}const fe=data.config.find(r=>r.Key==="filterEvery");if(fe)try{setFilterEvery(JSON.parse(fe.Value));}catch{}}
        if(data.pools&&data.pools.length){try{const p=data.pools.map(r=>r["JSON Data"]?JSON.parse(r["JSON Data"]):r).filter(r=>r&&r.customer).map(r=>{const def=DEFAULT_POOLS.find(d=>d.id===r.id);return{...(def||{}), ...r, serviceDay:r.serviceDay||def?.serviceDay||"Monday", scheduledTime:r.scheduledTime??def?.scheduledTime??420, serviceHistory:r.serviceHistory||[]};});if(p.length)setPools(p);}catch{}}
        if(data.users&&data.users.length){try{const u=data.users.map(r=>({id:r.ID,name:r.Name,role:r.Role,password:r.Password,phone:r.Phone})).filter(u=>u.id&&u.name);if(u.length)setUsers(u);}catch{}}
        if(data.invoices&&data.invoices.length){try{const inv=data.invoices.map(r=>({id:r.ID,customer:r.Customer,amount:parseFloat(r.Amount)||0,serviceDate:r["Service Date"],status:r.Status,paidDate:r["Paid Date"]||"",notes:r.Notes||""})).filter(i=>i.customer);if(inv.length)setInvoices(inv);}catch{}}
      }
      setLoading(false);
    }).catch(()=>setLoading(false));
  },[]);

  useEffect(()=>{
    if(!twilio.sid||loading) return;
    const lastCheck=lsGet("db_lastReminder","");const todayKey=new Date().toDateString();
    if(lastCheck===todayKey) return;lsSet("db_lastReminder",todayKey);
    pools.filter(p=>p.status==="Due Today"||p.status==="Scheduled").forEach(pool=>{
      const first=pool.customer.split(" ")[0];const body=`Hi ${first}! Just a reminder your Desert Bloom pool service is coming up soon. 🌵 — Desert Bloom`;
      sendSMS(pool.phone,body,twilio).then(()=>{const entry={customer:pool.customer,phone:pool.phone,body,type:"reminder",status:"sent",time:new Date().toLocaleTimeString()};setSmsLog(l=>[...l,entry]);DB.append("smslog",entry);}).catch(()=>{});
    });
  },[twilio.sid,loading]);

  const sync=async(key,data)=>{ setSyncStatus("syncing");await DB.set(key,data);setSyncStatus("synced");setTimeout(()=>setSyncStatus(null),2000); };
  const upUsers=useCallback((u,currentUser)=>{ setUsers(u);const updatedSelf=u.find(x=>x.id===currentUser?.id);if(updatedSelf){setUser(updatedSelf);lsSet("db_session",updatedSelf);}sync("users",u); },[]);
  const upPools=useCallback(p=>{setPools(p);sync("pools",p);},[]);
  const upInvoices=useCallback(inv=>{setInvoices(inv);sync("invoices",inv);},[]);
  const upPool=useCallback(u=>{setPools(p=>p.map(x=>x.id===u.id?u:x));setSelPool(u);sync("pools",pools.map(x=>x.id===u.id?u:x));},[pools]);

  const doSend=async(pool,type)=>{
    const key=`${pool.id}_${type}`;
    if(!twilio.sid||!twilio.token){alert("⚠️ Set up Twilio in Settings first");return;}
    const first=pool.customer.split(" ")[0];
    const body=type==="onmyway"?`Hi ${first}! Your Desert Bloom pool tech is on the way! 🌵 Thanks!`:`Hi ${first}! Reminder: your Desert Bloom pool service is coming up soon. 🌵 — Desert Bloom`;
    setSending(s=>({...s,[key]:true}));
    try{
      await sendSMS(pool.phone,body,twilio);
      const entry={customer:pool.customer,phone:pool.phone,body,type,status:"sent",time:new Date().toLocaleTimeString()};
      setSmsLog(l=>[...l,entry]);DB.append("smslog",entry);
      if(type==="reminder") setRemindersSent(r=>({...r,[pool.id]:true}));
    }catch(e){
      const entry={customer:pool.customer,phone:pool.phone,body,type,status:"failed",error:e.message,time:new Date().toLocaleTimeString()};
      setSmsLog(l=>[...l,entry]);DB.append("smslog",entry);alert(`❌ Send failed: ${e.message}`);
    }
    setSending(s=>({...s,[key]:false}));
  };

  const nn=(pts)=>{ if(pts.length<=1)return pts; const res=[pts[0]],rem=[...pts.slice(1)]; while(rem.length){const last=res[res.length-1];let bi=0,bd=Infinity;rem.forEach((p,i)=>{const d=Math.hypot(p.lat-last.lat,p.lng-last.lng);if(d<bd){bd=d;bi=i;}});res.push(rem[bi]);rem.splice(bi,1);}return res; };
  const optimize=(subset)=>{ setOptimizing(true);setTimeout(()=>{const opt=nn(subset).map((p,i)=>({...p,order:i+1}));const merged=[...pools.filter(p=>!subset.find(s=>s.id===p.id)),...opt];upPools(merged);setOptimizing(false);},1200); };

  const doLogin=()=>{ const u=users.find(u=>(u.name.toLowerCase().replace(/\s/g,"")===(loginCreds.u.toLowerCase().replace(/\s/g,""))||u.id?.toLowerCase()===loginCreds.u.toLowerCase())&&u.password===loginCreds.p);if(u){setUser(u);lsSet("db_session",u);setLoginErr("");}else setLoginErr("Wrong username or password."); };
  const logout=()=>{setUser(null);lsSet("db_session",null);};
  const saveTwilio=async(cfg)=>{ setTwilio(cfg);await DB.setConfig("twilio",cfg);setTwilioSaved(true);setTimeout(()=>setTwilioSaved(false),3000); };
  const testTwilio=async()=>{
    setTwilioTesting(true);setTwilioTest(null);
    try{
      const res=await fetch(`https://api.twilio.com/2010-04-01/Accounts/${twilio.sid}.json`,{headers:{"Authorization":"Basic "+btoa(`${twilio.sid}:${twilio.token}`)}});
      const data=await res.json();
      if(res.ok) setTwilioTest({ok:true,msg:`✓ Connected — Account: ${data.friendly_name||twilio.sid}`});
      else setTwilioTest({ok:false,msg:`❌ ${data.message||"Authentication failed"} (Code ${data.code||res.status})`});
    }catch(e){setTwilioTest({ok:false,msg:`❌ Network error: ${e.message}`});}
    setTwilioTesting(false);
  };

  if(loading) return(
    <div style={{fontFamily:"sans-serif",background:"#060d1a",minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",color:"#e2e8f0"}}>
      <div style={{fontSize:52,marginBottom:16}}>🌵</div>
      <div style={{fontSize:18,fontWeight:700,marginBottom:8}}>Desert Bloom</div>
      <div style={{fontSize:13,color:"#6b7280"}}>Loading from Google Sheets...</div>
    </div>
  );

  if(!user) return(
    <div style={{fontFamily:"sans-serif",background:"linear-gradient(160deg,#060d1a,#0a1628)",minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:20}}>
      <div style={{textAlign:"center",marginBottom:28}}>
        <div style={{fontSize:52,marginBottom:8}}>🌵</div>
        <div style={{fontSize:26,fontWeight:800,color:"#f0f9ff",letterSpacing:"-0.5px"}}>Desert Bloom</div>
        <div style={{fontSize:11,color:"#374151",marginTop:4,letterSpacing:3,textTransform:"uppercase"}}>Pool Service</div>
      </div>
      <div style={{background:"#0d1626",borderRadius:20,padding:"26px 22px",width:"100%",maxWidth:340,border:"1px solid rgba(59,130,246,0.15)"}}>
        <Inp label="USERNAME" value={loginCreds.u} onChange={v=>setLoginCreds(x=>({...x,u:v}))} placeholder="Brett / JoseR / TylerM"/>
        <Inp label="PASSWORD" value={loginCreds.p} onChange={v=>setLoginCreds(x=>({...x,p:v}))} placeholder="••••••••" type="password"/>
        {loginErr&&<div style={{background:"rgba(239,68,68,0.1)",border:"1px solid rgba(239,68,68,0.25)",borderRadius:8,padding:"8px 12px",fontSize:12,color:"#f87171",marginBottom:14}}>{loginErr}</div>}
        <button onClick={doLogin} style={{width:"100%",background:"linear-gradient(135deg,#3b82f6,#06b6d4)",border:"none",borderRadius:12,padding:"13px",fontSize:14,fontWeight:700,color:"#fff",cursor:"pointer",marginBottom:12}}>Sign In →</button>
        <div style={{padding:"12px",background:"rgba(255,255,255,0.02)",borderRadius:10,border:"1px solid rgba(255,255,255,0.05)"}}>
          <div style={{fontSize:10,color:"#374151",marginBottom:6,letterSpacing:1}}>QUICK LOGIN</div>
          {users.slice(0,4).map(u=><div key={u.id} onClick={()=>setLoginCreds({u:u.name.replace(/\s/g,""),p:u.password})} style={{fontSize:11,color:"#60a5fa",cursor:"pointer",marginBottom:3}}>▸ {u.name} ({u.role})</div>)}
        </div>
      </div>
    </div>
  );

  if(visitPool) return <ServiceVisit pool={visitPool} filterEvery={filterEvery} twilio={twilio} currentUser={user} onComplete={u=>{upPool(u);setVisitPool(null);setSelPool(null);}} onBack={()=>setVisitPool(null)} onLogVisit={v=>DB.append("visits",v)}/>;
  if(addCustomer!==null) return <CustomerForm existing={addCustomer===true?null:addCustomer} users={users} onSave={pool=>{const updated=[...pools.filter(x=>x.id!==pool.id),pool];upPools(updated);}} onBack={()=>setAddCustomer(null)}/>;
  if(showUsers) return <UserManager users={users} onSave={u=>upUsers(u,user)} onBack={()=>setShowUsers(false)}/>;
  if(selPool) return <PoolDetail pool={selPool} filterEvery={filterEvery} onBack={()=>setSelPool(null)} onStartVisit={()=>setVisitPool(selPool)} onAddPhoto={ph=>upPool({...selPool,photos:[...selPool.photos,ph]})} onSendOnMyWay={()=>doSend(selPool,"onmyway")} sending={!!sending[`${selPool.id}_onmyway`]} onEdit={()=>setAddCustomer(selPool)}/>;

  const AppShell=({subtitle,nav,content})=>(
    <div style={{fontFamily:"sans-serif",background:"#060d1a",minHeight:"100vh",color:"#e2e8f0"}}>
      <div style={{background:"linear-gradient(135deg,#080f1e,#0d1f3c)",borderBottom:"1px solid rgba(59,130,246,0.15)",padding:"13px 16px",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <div style={{width:34,height:34,borderRadius:10,background:"linear-gradient(135deg,#f97316,#ec4899)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:18}}>🌵</div>
          <div><div style={{fontSize:16,fontWeight:800,color:"#fff"}}>Desert Bloom</div><div style={{fontSize:10,color:"#6b7280",letterSpacing:1,textTransform:"uppercase"}}>{subtitle}</div></div>
        </div>
        <div style={{display:"flex",gap:8,alignItems:"center"}}>
          <SyncBadge syncing={syncStatus==="syncing"} synced={syncStatus==="synced"}/>
          <button onClick={logout} style={{background:"rgba(255,255,255,0.05)",border:"1px solid rgba(255,255,255,0.07)",borderRadius:8,padding:"5px 10px",fontSize:12,color:"#6b7280",cursor:"pointer"}}>Sign Out</button>
        </div>
      </div>
      {nav}
      <div style={{paddingBottom:20}}>{content}</div>
    </div>
  );

  // ── OWNER ──
  if(user.role==="owner"){
    const ownerTabs=[
      {id:"overview",  label:"Overview",  icon:"🏠"},
      {id:"route",     label:"Route",     icon:"🗺️"},
      {id:"customers", label:"Customers", icon:"👤"},
      {id:"profit",    label:"Profit",    icon:"💰"},
      {id:"volume",    label:"Volume",    icon:"🏊"},
      {id:"texts",     label:"Texts",     icon:"💬"},
      {id:"techs",     label:"Techs",     icon:"👷"},
      {id:"settings",  label:"Settings",  icon:"⚙️"},
    ];
    const done=pools.filter(p=>p.status==="Completed"),over=pools.filter(p=>p.status==="Overdue");
    const techs=users.filter(u=>u.role==="tech");

    const tabContent={
      overview:(
        <div style={{padding:"16px"}}>
          <div style={{fontSize:18,fontWeight:700,marginBottom:2}}>Good morning, {user.name||"Brett"} 👋</div>
          <div style={{fontSize:13,color:"#4b5563",marginBottom:14}}>{todayStr()}</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:14}}>
            {[["Pools",pools.length,"🏊","#3b82f6"],["Due Today",pools.filter(p=>p.status==="Due Today").length,"📅","#f5a623"],["Overdue",over.length,"⚠️","#ef4444"],["Done",done.length,"✓","#22c55e"]].map(([l,v,ic,c])=>(
              <div key={l} style={{background:"#0d1626",borderRadius:14,padding:"14px",border:`1px solid ${c}22`}}><div style={{fontSize:20,marginBottom:4}}>{ic}</div><div style={{fontSize:24,fontWeight:800,color:c}}>{v}</div><div style={{fontSize:11,color:"#6b7280"}}>{l}</div></div>
            ))}
          </div>
          <Card style={{marginBottom:14,background:"linear-gradient(135deg,rgba(34,197,94,0.08),rgba(59,130,246,0.05))"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div><div style={{fontSize:12,color:"#6b7280",marginBottom:2}}>COLLECTED THIS MONTH</div><div style={{fontSize:22,fontWeight:800,color:"#22c55e"}}>{fmtMoney(invoices.filter(i=>i.status==="Paid").reduce((s,i)=>s+Number(i.amount||0),0))}</div></div>
              <div style={{textAlign:"right"}}><div style={{fontSize:12,color:"#6b7280",marginBottom:2}}>PENDING</div><div style={{fontSize:18,fontWeight:700,color:"#f5a623"}}>{fmtMoney(invoices.filter(i=>i.status!=="Paid").reduce((s,i)=>s+Number(i.amount||0),0))}</div></div>
            </div>
            <button onClick={()=>setOwnerTab("profit")} style={{marginTop:10,width:"100%",background:"rgba(34,197,94,0.1)",border:"1px solid rgba(34,197,94,0.2)",borderRadius:10,padding:"8px",fontSize:12,fontWeight:600,color:"#22c55e",cursor:"pointer"}}>View Full Profit Tracker →</button>
          </Card>
          {over.length>0&&<div style={{background:"rgba(239,68,68,0.07)",border:"1px solid rgba(239,68,68,0.2)",borderRadius:12,padding:"12px 14px",marginBottom:14}}><div style={{fontSize:13,fontWeight:700,color:"#f87171",marginBottom:6}}>⚠️ Overdue</div>{over.map(p=><div key={p.id} onClick={()=>setSelPool(p)} style={{fontSize:13,color:"#fca5a5",cursor:"pointer",padding:"2px 0"}}>▸ {p.customer}</div>)}</div>}
          <div style={{fontSize:12,fontWeight:700,color:"#6b7280",marginBottom:8,letterSpacing:1}}>ALL ACCOUNTS</div>
          {pools.map(p=>(
            <div key={p.id} onClick={()=>setSelPool(p)} style={{background:"#0d1626",borderRadius:13,padding:"13px 14px",marginBottom:8,border:"1px solid rgba(255,255,255,0.04)",cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div><div style={{fontWeight:600,fontSize:14}}>{p.customer}</div><div style={{fontSize:11,color:"#6b7280"}}>{p.type} · {users.find(u=>u.id===p.tech)?.name||p.tech} · {fmtMoney(p.monthlyRate)}/mo</div></div>
              <Badge status={p.status}/>
            </div>
          ))}
        </div>
      ),
      route:(
        <>
          <div style={{padding:"14px 16px 0",display:"flex",justifyContent:"flex-end"}}>
            <button onClick={()=>optimize([...pools].sort((a,b)=>(a.order||99)-(b.order||99)))} disabled={optimizing} style={{background:optimizing?"#1f2937":"linear-gradient(135deg,#22c55e,#16a34a)",border:"none",borderRadius:10,padding:"8px 16px",fontSize:12,fontWeight:700,color:optimizing?"#6b7280":"#fff",cursor:"pointer"}}>{optimizing?"⚙️ Optimizing...":"⚡ Optimize All"}</button>
          </div>
          <RouteList pools={routeFilter==="all"?pools:pools.filter(p=>p.tech===routeFilter)} onReorder={re=>upPools([...pools.filter(p=>!re.find(r=>r.id===p.id)),...re])} onSelect={setSelPool} onTimeChange={(id,mins)=>upPools(pools.map(p=>p.id===id?{...p,scheduledTime:mins}:p))} techFilter={routeFilter} setTechFilter={setRouteFilter} users={users}/>
        </>
      ),
      customers:(
        <div style={{padding:"16px"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
            <div><div style={{fontSize:18,fontWeight:700}}>Customers</div><div style={{fontSize:13,color:"#4b5563"}}>{pools.length} accounts · {fmtMoney(pools.reduce((s,p)=>s+Number(p.monthlyRate||0),0))}/mo recurring</div></div>
            <button onClick={()=>setAddCustomer(true)} style={{background:"linear-gradient(135deg,#3b82f6,#06b6d4)",border:"none",borderRadius:12,padding:"10px 16px",fontSize:13,fontWeight:700,color:"#fff",cursor:"pointer"}}>+ Add</button>
          </div>
          {pools.map(p=>(
            <div key={p.id} style={{background:"#0d1626",borderRadius:13,padding:"13px 14px",marginBottom:8,border:"1px solid rgba(255,255,255,0.04)",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div onClick={()=>setSelPool(p)} style={{flex:1,cursor:"pointer"}}>
                <div style={{fontWeight:600,fontSize:14}}>{p.customer}</div>
                <div style={{fontSize:11,color:"#6b7280",marginTop:2}}>{p.phone} · {users.find(u=>u.id===p.tech)?.name||p.tech}</div>
                <div style={{fontSize:11,color:"#6b7280"}}>{p.address.split(",")[0]} · {p.serviceDay||""}</div>
                {p.monthlyRate&&<div style={{fontSize:12,color:"#22c55e",fontWeight:600,marginTop:2}}>{fmtMoney(p.monthlyRate)}/mo</div>}
              </div>
              <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:6}}>
                <Badge status={p.status}/>
                <div style={{display:"flex",gap:6}}>
                  <button onClick={()=>setAddCustomer(p)} style={{fontSize:11,background:"rgba(255,255,255,0.05)",border:"1px solid rgba(255,255,255,0.08)",borderRadius:7,padding:"3px 10px",color:"#9ca3af",cursor:"pointer"}}>Edit</button>
                  <button onClick={()=>{if(window.confirm(`Remove ${p.customer}?`)){const updated=pools.filter(x=>x.id!==p.id);upPools(updated);}}} style={{fontSize:11,background:"rgba(239,68,68,0.08)",border:"1px solid rgba(239,68,68,0.2)",borderRadius:7,padding:"3px 10px",color:"#ef4444",cursor:"pointer"}}>Delete</button>
                </div>
              </div>
            </div>
          ))}
        </div>
      ),
      profit:<ProfitTracker pools={pools} invoices={invoices} setInvoices={upInvoices} users={users}/>,
      volume:<PoolVolumeCalc/>,
      texts:(
        <div style={{padding:"16px"}}>
          <div style={{fontSize:18,fontWeight:700,marginBottom:4}}>💬 Texting</div>
          <div style={{fontSize:13,color:"#4b5563",marginBottom:14}}>On My Way & Reminders</div>
          {!twilio.sid&&<div style={{background:"rgba(239,68,68,0.08)",border:"1px solid rgba(239,68,68,0.3)",borderRadius:14,padding:"14px",marginBottom:14,display:"flex",gap:12,alignItems:"center"}}><span style={{fontSize:24}}>⚠️</span><div style={{flex:1}}><div style={{fontSize:13,fontWeight:700,color:"#f87171"}}>Twilio not set up</div><div style={{fontSize:12,color:"#9ca3af"}}>Go to Settings tab</div></div><button onClick={()=>setOwnerTab("settings")} style={{background:"linear-gradient(135deg,#f5a623,#e07b00)",border:"none",borderRadius:10,padding:"8px 14px",fontSize:12,fontWeight:700,color:"#fff",cursor:"pointer"}}>Setup</button></div>}
          <Card style={{marginBottom:14,border:"1px solid rgba(245,166,35,0.25)"}}>
            <div style={{fontSize:14,fontWeight:700,color:"#f5a623",marginBottom:4}}>📅 2-Day Reminders</div>
            <div style={{fontSize:12,color:"#6b7280",marginBottom:10}}>Auto-sent daily at app open · send manually below</div>
            <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:12}}>{pools.filter(p=>p.status!=="Completed").map(p=>(<span key={p.id} style={{fontSize:11,background:remindersSent[p.id]?"rgba(34,197,94,0.15)":"rgba(255,255,255,0.05)",color:remindersSent[p.id]?"#22c55e":"#9ca3af",border:`1px solid ${remindersSent[p.id]?"rgba(34,197,94,0.3)":"rgba(255,255,255,0.08)"}`,borderRadius:20,padding:"4px 12px",fontWeight:600}}>{remindersSent[p.id]?"✓ ":""}{p.customer.split(" ")[0]}</span>))}</div>
            <button onClick={()=>pools.filter(p=>p.status!=="Completed").forEach(p=>doSend(p,"reminder"))} style={{width:"100%",background:"linear-gradient(135deg,#f5a623,#e07b00)",border:"none",borderRadius:12,padding:"13px",fontSize:14,fontWeight:700,color:"#fff",cursor:"pointer"}}>📨 Send All Reminders Now</button>
          </Card>
          <div style={{fontSize:12,fontWeight:700,color:"#6b7280",marginBottom:8,letterSpacing:1}}>🚗 ON MY WAY</div>
          {pools.map(p=>(<div key={p.id} style={{background:"#0d1626",borderRadius:13,padding:"12px 14px",marginBottom:8,border:"1px solid rgba(255,255,255,0.04)",display:"flex",alignItems:"center",gap:10}}><div style={{flex:1}}><div style={{fontWeight:600,fontSize:14}}>{p.customer}</div><div style={{fontSize:11,color:"#6b7280"}}>{p.phone}</div></div><button onClick={()=>doSend(p,"onmyway")} disabled={!!sending[`${p.id}_onmyway`]} style={{background:sending[`${p.id}_onmyway`]?"#1f2937":"linear-gradient(135deg,#f5a623,#e07b00)",border:"none",borderRadius:10,padding:"9px 14px",fontSize:12,fontWeight:700,color:sending[`${p.id}_onmyway`]?"#6b7280":"#fff",cursor:"pointer",whiteSpace:"nowrap"}}>{sending[`${p.id}_onmyway`]?"⏳":"🚗 Send"}</button></div>))}
          <div style={{fontSize:12,fontWeight:700,color:"#6b7280",marginBottom:8,marginTop:18,letterSpacing:1}}>📋 SMS LOG ({smsLog.length})</div>
          {smsLog.length===0&&<div style={{background:"#0d1626",borderRadius:12,padding:"20px",textAlign:"center",color:"#374151",fontSize:13}}>No messages sent yet</div>}
          {[...smsLog].reverse().slice(0,20).map((e,i)=>(<div key={i} style={{background:"#0d1626",borderRadius:12,padding:"12px 14px",marginBottom:8,border:`1px solid ${e.status==="sent"?"rgba(34,197,94,0.12)":"rgba(239,68,68,0.2)"}`}}><div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:5}}><div><div style={{fontWeight:600,fontSize:13}}>{e.customer}</div><div style={{fontSize:11,color:"#6b7280"}}>{e.time} · {e.type==="onmyway"?"🚗":e.type==="completion"?"✅":"📅"}</div></div><div style={{background:e.status==="sent"?"rgba(34,197,94,0.12)":"rgba(239,68,68,0.12)",color:e.status==="sent"?"#22c55e":"#ef4444",fontSize:10,fontWeight:700,padding:"3px 8px",borderRadius:20}}>{e.status==="sent"?"✓ Sent":"✗ Failed"}</div></div><div style={{fontSize:12,color:"#9ca3af",background:"#111827",borderRadius:8,padding:"7px 10px",lineHeight:1.5}}>{e.body}</div></div>))}
        </div>
      ),
      techs:(
        <div style={{padding:"16px"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
            <div style={{fontSize:18,fontWeight:700}}>Technicians</div>
            <button onClick={()=>setShowUsers(true)} style={{background:"rgba(59,130,246,0.1)",border:"1px solid rgba(59,130,246,0.2)",borderRadius:10,padding:"8px 14px",fontSize:12,fontWeight:600,color:"#60a5fa",cursor:"pointer"}}>Manage Users</button>
          </div>
          {techs.map(t=>{
            const tp=pools.filter(p=>p.tech===t.id);
            const techRevenue=invoices.filter(i=>i.status==="Paid"&&tp.find(p=>p.customer===i.customer)).reduce((s,i)=>s+Number(i.amount||0),0);
            return(<div key={t.id} style={{background:"#0d1626",borderRadius:16,padding:"18px",marginBottom:14,border:"1px solid rgba(255,255,255,0.06)"}}>
              <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:14}}>
                <div style={{width:46,height:46,borderRadius:50,background:"linear-gradient(135deg,#3b82f6,#8b5cf6)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,fontWeight:800,color:"#fff"}}>{t.name.split(" ").map(n=>n[0]).join("").slice(0,2)}</div>
                <div style={{flex:1}}><div style={{fontSize:16,fontWeight:700}}>{t.name}</div><div style={{fontSize:12,color:"#6b7280"}}>Field Technician</div></div>
                <div style={{textAlign:"right"}}><div style={{fontSize:14,fontWeight:700,color:"#22c55e"}}>{fmtMoney(techRevenue)}</div><div style={{fontSize:10,color:"#6b7280"}}>collected</div></div>
              </div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:12}}>
                {[["Assigned",tp.length,"#60a5fa"],["Done",tp.filter(p=>p.status==="Completed").length,"#22c55e"],["Alerts",tp.filter(p=>cStat(p.chlorine,"chlorine")!=="ok"||cStat(p.ph,"ph")!=="ok").length,"#f5a623"]].map(([l,v,c])=>(<div key={l} style={{background:"#111827",borderRadius:10,padding:"10px 8px",textAlign:"center"}}><div style={{fontSize:20,fontWeight:800,color:c}}>{v}</div><div style={{fontSize:10,color:"#6b7280"}}>{l}</div></div>))}
              </div>
              {tp.map(p=><div key={p.id} onClick={()=>setSelPool(p)} style={{display:"flex",justifyContent:"space-between",padding:"8px 0",borderBottom:"1px solid rgba(255,255,255,0.04)",cursor:"pointer"}}><span style={{fontSize:13,color:"#d1d5db"}}>{p.customer||""}</span><Badge status={p.status}/></div>)}
            </div>);
          })}
        </div>
      ),
      settings:(
        <div style={{padding:"16px"}}>
          <div style={{fontSize:18,fontWeight:700,marginBottom:4}}>⚙️ Settings</div>
          <div style={{fontSize:13,color:"#4b5563",marginBottom:16}}>All data syncs to Google Sheets automatically</div>
          <Card style={{marginBottom:14}}>
            <div style={{fontSize:13,fontWeight:700,marginBottom:12}}>📱 Twilio SMS</div>
            {twilio.sid&&<div style={{fontSize:12,color:"#22c55e",marginBottom:10}}>✓ Configured · {twilio.from}</div>}
            {[["ACCOUNT SID","sid","AC..."],["FROM NUMBER","from","+14805715896"]].map(([l,k,ph])=>(<div key={k} style={{marginBottom:12}}><div style={{fontSize:11,color:"#6b7280",marginBottom:4,letterSpacing:1}}>{l}</div><input type="text" value={twilio[k]} onChange={e=>setTwilio(v=>({...v,[k]:e.target.value}))} placeholder={ph} style={{width:"100%",background:"#111827",border:"1px solid rgba(255,255,255,0.08)",borderRadius:9,padding:"10px 13px",fontSize:13,color:"#e2e8f0",outline:"none",boxSizing:"border-box",fontFamily:"monospace"}}/></div>))}
            <div style={{marginBottom:12}}>
              <div style={{fontSize:11,color:"#6b7280",marginBottom:4,letterSpacing:1}}>AUTH TOKEN</div>
              <div style={{display:"flex",gap:8,alignItems:"center"}}>
                <input type={showToken?"text":"password"} value={twilio.token} onChange={e=>setTwilio(v=>({...v,token:e.target.value}))} placeholder="Your auth token" autoComplete="off" style={{flex:1,background:"#111827",border:"1px solid rgba(255,255,255,0.08)",borderRadius:9,padding:"10px 13px",fontSize:13,color:"#e2e8f0",outline:"none",boxSizing:"border-box",fontFamily:"monospace"}}/>
                <button onClick={()=>setShowToken(v=>!v)} style={{background:"rgba(255,255,255,0.06)",border:"1px solid rgba(255,255,255,0.1)",borderRadius:8,padding:"8px 12px",fontSize:12,color:"#9ca3af",cursor:"pointer",whiteSpace:"nowrap"}}>{showToken?"Hide":"Show"}</button>
              </div>
              {twilio.token&&<div style={{fontSize:11,color:"#374151",marginTop:4}}>Length: {twilio.token.length} chars {twilio.token.length===32?"✓ looks right":"⚠️ should be 32"}</div>}
            </div>
            <button onClick={()=>saveTwilio(twilio)} style={{width:"100%",background:"linear-gradient(135deg,#3b82f6,#06b6d4)",border:"none",borderRadius:12,padding:"12px",fontSize:14,fontWeight:700,color:"#fff",cursor:"pointer",marginBottom:8}}>Save to Google Sheets</button>
            <button onClick={testTwilio} disabled={twilioTesting||!twilio.sid} style={{width:"100%",background:twilioTesting?"#1f2937":"rgba(255,255,255,0.05)",border:"1px solid rgba(255,255,255,0.1)",borderRadius:12,padding:"12px",fontSize:14,fontWeight:700,color:twilioTesting||!twilio.sid?"#374151":"#9ca3af",cursor:twilio.sid?"pointer":"not-allowed"}}>{twilioTesting?"⏳ Testing...":"🔌 Test Connection"}</button>
            {twilioSaved&&<div style={{marginTop:10,background:"rgba(34,197,94,0.1)",border:"1px solid rgba(34,197,94,0.3)",borderRadius:10,padding:"10px",textAlign:"center",color:"#22c55e",fontWeight:700,fontSize:13}}>✓ Saved!</div>}
            {twilioTest&&<div style={{marginTop:10,background:twilioTest.ok?"rgba(34,197,94,0.1)":"rgba(239,68,68,0.1)",border:`1px solid ${twilioTest.ok?"rgba(34,197,94,0.3)":"rgba(239,68,68,0.3)"}`,borderRadius:10,padding:"10px 12px",fontSize:13,color:twilioTest.ok?"#22c55e":"#f87171",fontWeight:600}}>{twilioTest.msg}</div>}
          </Card>
          <Card style={{marginBottom:14}}>
            <div style={{fontSize:13,fontWeight:700,marginBottom:4}}>🔵 Filter Cleaning Schedule</div>
            <div style={{fontSize:12,color:"#6b7280",marginBottom:12}}>Visits between filter cleanings</div>
            <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:12}}>
              <input type="number" value={filterEvery} onChange={e=>setFilterEvery(parseInt(e.target.value)||20)} min="1" max="100" style={{width:80,background:"#111827",border:"1px solid rgba(255,255,255,0.08)",borderRadius:9,padding:"10px 13px",fontSize:18,fontWeight:700,color:"#f5a623",outline:"none",textAlign:"center",boxSizing:"border-box"}}/>
              <div style={{fontSize:14,color:"#d1d5db"}}>visits between cleanings</div>
            </div>
            <button onClick={()=>{lsSet("db_filterEvery",filterEvery);DB.setConfig("filterEvery",filterEvery);setFilterSaved(true);setTimeout(()=>setFilterSaved(false),2000);}} style={{width:"100%",background:"linear-gradient(135deg,#f5a623,#e07b00)",border:"none",borderRadius:12,padding:"12px",fontSize:14,fontWeight:700,color:"#fff",cursor:"pointer"}}>Save Schedule</button>
            {filterSaved&&<div style={{marginTop:10,background:"rgba(34,197,94,0.1)",border:"1px solid rgba(34,197,94,0.3)",borderRadius:10,padding:"10px",textAlign:"center",color:"#22c55e",fontWeight:700,fontSize:13}}>✓ Saved!</div>}
          </Card>
          <Card style={{marginBottom:14}}>
            <div style={{fontSize:13,fontWeight:700,marginBottom:4}}>👥 User Management</div>
            <div style={{fontSize:12,color:"#6b7280",marginBottom:12}}>{users.length} users</div>
            <button onClick={()=>setShowUsers(true)} style={{width:"100%",background:"rgba(59,130,246,0.1)",border:"1px solid rgba(59,130,246,0.2)",borderRadius:12,padding:"12px",fontSize:14,fontWeight:600,color:"#60a5fa",cursor:"pointer"}}>Manage Users →</button>
          </Card>
        </div>
      ),
    };

    return <AppShell subtitle="Owner Dashboard" nav={<TopNav tabs={ownerTabs} active={ownerTab} onChange={setOwnerTab}/>} content={tabContent[ownerTab]}/>;
  }

  // ── TECH ──
  const myPools=pools.filter(p=>p.tech===user.id).sort((a,b)=>(a.order||99)-(b.order||99));
  const remaining=myPools.filter(p=>p.status!=="Completed");
  const doneMy=myPools.filter(p=>p.status==="Completed");
  const next=remaining[0];
  const techTabs=[
    {id:"day",     label:"My Day",    icon:"⬡"},
    {id:"route",   label:"Route",     icon:"🗺️"},
    {id:"customers",label:"Customers",icon:"👤"},
    {id:"volume",  label:"Volume",    icon:"🏊"},
    {id:"done",    label:"Done",      icon:"✓"},
  ];

  const techContent={
    day:(
      <div style={{padding:"16px"}}>
        <div style={{fontSize:18,fontWeight:700,marginBottom:2}}>Hey {(user.name||"Tech").split(" ")[0]} 👋</div>
        <div style={{fontSize:13,color:"#4b5563",marginBottom:14}}>{remaining.length} stops remaining · {todayStr()}</div>
        <Card style={{marginBottom:14}}>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}><span style={{fontSize:13,color:"#9ca3af"}}>Progress</span><span style={{fontSize:14,fontWeight:700,color:"#22c55e"}}>{doneMy.length}/{myPools.length}</span></div>
          <div style={{background:"#111827",borderRadius:99,height:10,overflow:"hidden"}}><div style={{background:"linear-gradient(90deg,#22c55e,#06b6d4)",width:`${myPools.length?(doneMy.length/myPools.length)*100:0}%`,height:"100%",borderRadius:99,transition:"width .6s"}}/></div>
        </Card>
        <button onClick={()=>optimize(myPools)} disabled={optimizing} style={{width:"100%",background:optimizing?"#0d1626":"linear-gradient(135deg,#1f2937,#111827)",border:"1px solid rgba(59,130,246,0.2)",borderRadius:12,padding:"11px",fontSize:13,fontWeight:700,color:optimizing?"#6b7280":"#60a5fa",cursor:"pointer",marginBottom:14}}>{optimizing?"⚙️ Optimizing...":"⚡ Optimize My Route"}</button>
        {next&&(
          <>
            <div style={{fontSize:11,fontWeight:700,color:"#6b7280",marginBottom:8,letterSpacing:1}}>NEXT STOP</div>
            <div style={{background:"linear-gradient(135deg,#0d1f3c,#0a1628)",borderRadius:16,padding:"16px",marginBottom:14,border:"1px solid rgba(59,130,246,0.25)"}}>
              <div style={{fontWeight:700,fontSize:16,marginBottom:4}}>{next.customer}</div>
              <button onClick={()=>openMaps(next.address)} style={{fontSize:13,color:"#60a5fa",background:"none",border:"none",cursor:"pointer",padding:0,textDecoration:"underline",marginBottom:8,display:"block"}}>📍 {next.address.split(",")[0]}</button>
              {next.filterVisits>=filterEvery&&<div style={{fontSize:12,color:"#ef4444",background:"rgba(239,68,68,0.08)",borderRadius:8,padding:"6px 10px",marginBottom:10}}>🔵 Filter clean due this visit</div>}
              <div style={{display:"flex",gap:8}}>
                <button onClick={()=>doSend(next,"onmyway")} disabled={!!sending[`${next.id}_onmyway`]} style={{flex:1,background:sending[`${next.id}_onmyway`]?"#1f2937":"linear-gradient(135deg,#f5a623,#e07b00)",border:"none",borderRadius:10,padding:"11px",fontSize:13,fontWeight:700,color:sending[`${next.id}_onmyway`]?"#6b7280":"#fff",cursor:"pointer"}}>{sending[`${next.id}_onmyway`]?"⏳":"🚗 On My Way"}</button>
                <button onClick={()=>setVisitPool(next)} style={{flex:1,background:"linear-gradient(135deg,#22c55e,#16a34a)",border:"none",borderRadius:10,padding:"11px",fontSize:13,fontWeight:700,color:"#fff",cursor:"pointer"}}>▶ Start Visit</button>
              </div>
            </div>
          </>
        )}
        <div style={{fontSize:11,fontWeight:700,color:"#6b7280",marginBottom:8,letterSpacing:1}}>ALL MY STOPS</div>
        {myPools.map(p=>(
          <div key={p.id} onClick={()=>setSelPool(p)} style={{background:"#0d1626",borderRadius:13,padding:"12px 14px",marginBottom:8,border:"1px solid rgba(255,255,255,0.04)",cursor:"pointer",display:"flex",gap:10,alignItems:"center"}}>
            <div style={{width:26,height:26,borderRadius:50,background:p.status==="Completed"?"#22c55e":"#1f2937",display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:700,color:p.status==="Completed"?"#fff":"#6b7280",flexShrink:0}}>{p.status==="Completed"?"✓":p.order}</div>
            <div style={{flex:1}}><div style={{fontWeight:600,fontSize:14}}>{p.customer}</div><div style={{fontSize:11,color:"#6b7280"}}>{p.address.split(",")[0]}</div></div>
            <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:3}}><Badge status={p.status}/>{p.filterVisits>=filterEvery&&<span style={{fontSize:9,color:"#ef4444"}}>🔵 filter due</span>}</div>
          </div>
        ))}
      </div>
    ),
    route:(
      <>
        <div style={{padding:"14px 16px 0",display:"flex",justifyContent:"flex-end"}}>
          <button onClick={()=>optimize(myPools)} disabled={optimizing} style={{background:optimizing?"#1f2937":"linear-gradient(135deg,#22c55e,#16a34a)",border:"none",borderRadius:10,padding:"8px 14px",fontSize:12,fontWeight:700,color:optimizing?"#6b7280":"#fff",cursor:"pointer"}}>{optimizing?"⚙️...":"⚡ Optimize"}</button>
        </div>
        <RouteList pools={myPools} onReorder={re=>upPools([...pools.filter(p=>!re.find(r=>r.id===p.id)),...re])} onSelect={setSelPool} onTimeChange={(id,mins)=>upPools(pools.map(p=>p.id===id?{...p,scheduledTime:mins}:p))} techFilter={user.id} setTechFilter={()=>{}} users={users} showFilter={false}/>
      </>
    ),
    customers:(
      <div style={{padding:"16px"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
          <div><div style={{fontSize:18,fontWeight:700}}>Customers</div><div style={{fontSize:13,color:"#4b5563"}}>Add or view accounts</div></div>
          <button onClick={()=>setAddCustomer(true)} style={{background:"linear-gradient(135deg,#3b82f6,#06b6d4)",border:"none",borderRadius:12,padding:"10px 16px",fontSize:13,fontWeight:700,color:"#fff",cursor:"pointer"}}>+ Add</button>
        </div>
        {pools.map(p=>(<div key={p.id} onClick={()=>setSelPool(p)} style={{background:"#0d1626",borderRadius:13,padding:"13px 14px",marginBottom:8,border:"1px solid rgba(255,255,255,0.04)",cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center"}}><div><div style={{fontWeight:600,fontSize:14}}>{p.customer}</div><div style={{fontSize:11,color:"#6b7280"}}>{p.address.split(",")[0]} · {p.type}</div></div><Badge status={p.status}/></div>))}
      </div>
    ),
    volume:<PoolVolumeCalc/>,
    done:(
      <div style={{padding:"16px"}}>
        <div style={{fontSize:18,fontWeight:700,marginBottom:4}}>Completed Today</div>
        <div style={{fontSize:13,color:"#4b5563",marginBottom:14}}>{doneMy.length} stops done</div>
        {doneMy.length===0&&<Card><div style={{textAlign:"center",color:"#374151",fontSize:14,padding:"20px 0"}}>No completed stops yet</div></Card>}
        {doneMy.map(p=>(<div key={p.id} onClick={()=>setSelPool(p)} style={{background:"#0d1626",borderRadius:13,padding:"14px",marginBottom:8,border:"1px solid rgba(34,197,94,0.1)",cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}><div><div style={{fontWeight:600,fontSize:14}}>{p.customer}</div><div style={{fontSize:12,color:"#6b7280"}}>{p.address.split(",")[0]}</div><div style={{fontSize:12,color:"#22c55e",marginTop:4}}>✓ {p.lastService}{p.lastDuration?` · ${fmtTime(p.lastDuration)}`:""}</div>{(p.photos?.length>0||p.afterPhotos?.length>0)&&<div style={{fontSize:11,color:"#6b7280"}}>📷 {p.photos?.length||0} before · {p.afterPhotos?.length||0} after</div>}</div><Badge status={p.status}/></div>))}
      </div>
    ),
  };

  return <AppShell subtitle="Technician" nav={<TopNav tabs={techTabs} active={techTab} onChange={setTechTab}/>} content={techContent[techTab]}/>;
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(DesertBloom));
  </script>
</body>
</html>
